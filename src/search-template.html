<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公基知识库</title>
<style>
:root{color-scheme:light;--ink:#172238;--muted:#536176;--line:#dfe5ed;--blue:#2557a7;--pale:#f4f7fb;--gold:#a46a13}
*{box-sizing:border-box}body{margin:0;font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#f8fafc}
.wrap{max-width:1160px;margin:auto;padding:0 24px}.hero{padding:46px 0 32px;background:linear-gradient(120deg,#172d53,#244d79);color:#fff}
.eyebrow{letter-spacing:.2em;text-transform:uppercase;font-size:12px;opacity:.75;margin:0 0 8px}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.15;margin:0 0 10px}.hero p{max-width:760px;margin:0;color:#dce8f5}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.stat{padding:7px 12px;border:1px solid #ffffff55;border-radius:100px;font-size:13px}
main{padding:28px 0 60px}.grid{display:grid;grid-template-columns:280px 1fr;gap:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 16px #15304a08}.panel h2{font-size:18px;margin:0 0 16px}.side{align-self:start;position:sticky;top:18px}
.input,.select{font:inherit;width:100%;padding:11px 13px;border:1px solid #bcc9d8;border-radius:9px;background:#fff;color:var(--ink)}.input:focus,.select:focus{outline:3px solid #a4c3f080;border-color:var(--blue)}label{display:block;font-size:13px;font-weight:700;margin:15px 0 6px}.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.topic-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.topic{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--pale);text-align:left;font:inherit;color:var(--ink);cursor:pointer}.topic:hover,.topic:focus{border-color:var(--blue);background:#e9f1fd}.topic b{display:block}.topic small{color:var(--muted)}
.sources{display:grid;gap:8px}.source{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.source:hover{border-color:var(--blue);background:#f7faff}.source strong{display:block;font-size:13px}.source span{font-size:12px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:15px}.row h2{margin:0}.count{color:var(--muted);font-size:13px}.results{display:grid;gap:10px;margin-top:18px}.result{border-top:1px solid var(--line);padding:15px 0 4px}.result:first-child{border-top:0}.result a{font-weight:700;color:var(--blue);text-decoration:none}.result a:hover{text-decoration:underline}.meta{font-size:12px;color:var(--muted);margin:3px 0 7px}.snippet{color:#334155;font-size:14px;line-height:1.7;overflow-wrap:anywhere;margin:0}mark{background:#ffedb6;border-radius:2px;padding:0 1px}.empty{color:var(--muted);padding:26px 0}.note{background:#fff7e8;color:#624411;border:1px solid #f1dbaf;border-radius:10px;padding:12px 14px;font-size:13px;margin-top:16px}.link{color:var(--blue)}
@media(max-width:800px){.grid{grid-template-columns:1fr}.side{position:static}.hero{padding:34px 0}.wrap{padding:0 16px}}
</style>
</head>
<body>
<header class="hero"><div class="wrap"><p class="eyebrow">离线 · 可追溯 · 按页检索</p><h1>公共基础知识库</h1><p>把五份资料与吉林专题放进同一套学科目录。可以先进入<a href="学习与刷题.html" style="color:#fff">系统学习与刷题</a>，需要查证时再输入知识点，定位到原 PDF 页。</p><div class="stats"><span class="stat">5 份资料</span><span class="stat">1,878 个 PDF 页</span><span class="stat">12 个学习单元 · 72 道题</span></div></div></header>
<main class="wrap"><div class="grid">
<aside class="panel side"><h2>查找知识点</h2><input class="input" id="query" type="search" placeholder="例如：行政复议、机会成本" autocomplete="off" autofocus><p class="hint">多个词用空格隔开，结果需同时包含所有词。</p><label for="category">主题</label><select class="select" id="category"><option value="">全部主题</option></select><label for="source">资料</label><select class="select" id="source"><option value="">全部资料</option></select><div class="note">图片版经过文字识别，可能漏字或错字。法律、政策和时政条目请以 PDF 原页及现行权威文件核对。</div></aside>
<section><div class="panel"><div class="row"><h2>按主题浏览</h2><a class="link" href="学习与刷题.html">开始系统学习与刷题 →</a></div><div class="topic-list" id="topics"></div></div>
<div class="panel" style="margin-top:18px"><div class="row"><h2>检索结果</h2><span id="count" class="count"></span></div><div id="results" class="results"><p class="empty">输入知识点或选择主题开始检索。</p></div></div></section>
</div><section class="panel" style="margin-top:22px"><h2>资料来源</h2><div id="sources" class="sources"></div></section></main>
<script>
/*__KB_DATA__*/
const q=document.getElementById('query'),cat=document.getElementById('category'),src=document.getElementById('source'),results=document.getElementById('results'),count=document.getElementById('count');
const sourceMap=Object.fromEntries(KB_DATA.sources.map(s=>[s.id,s]));
const categories=['法律','政治哲学','经济','公文','历史文学','管理','科技','地理','道德','吉林省情','参考答案','目录'];
const tips={'法律':'法理 · 宪法 · 民法 · 刑法 · 行政法','政治哲学':'马克思主义 · 毛泽东思想 · 中国特色社会主义','经济':'政经 · 微观 · 宏观 · 国际经济','公文':'文种 · 格式 · 行文规则','历史文学':'中国史 · 世界史 · 诗词文学','管理':'管理学 · 行政管理 · 事业单位','科技':'物理 · 化学 · 生物 · 航天','地理':'中国地理 · 自然地理','道德':'公民道德 · 职业道德','吉林省情':'吉林地理 · 区划 · 历史 · 产业 · 生态文化','参考答案':'思维导图填空答案','目录':'封面与目录'};
for(const c of categories){const option=document.createElement('option');option.value=c;option.textContent=c;cat.append(option);const button=document.createElement('button');button.className='topic';button.innerHTML='<b>'+c+'</b><small>'+tips[c]+'</small>';button.onclick=()=>{cat.value=c;run();document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'})};document.getElementById('topics').append(button)}
for(const s of KB_DATA.sources){const option=document.createElement('option');option.value=s.id;option.textContent=s.name;src.append(option);const a=document.createElement('a');a.className='source';a.href=s.uri;a.target='_blank';const strong=document.createElement('strong');strong.textContent=s.name;const meta=document.createElement('span');meta.textContent=`${s.pages} ${s.kind==='study-notes'?'节':'页'} · ${s.method} · ${s.edition}`;a.append(strong,meta);document.getElementById('sources').append(a)}
function normalize(t){return t.toLocaleLowerCase('zh-CN').replace(/\s+/g,'')}
function makeSnippet(t,terms){const flat=t.replace(/\s+/g,' ');const n=normalize(flat);let pos=-1;for(const term of terms){const found=n.indexOf(term);if(found>=0&&(pos<0||found<pos))pos=found}if(pos<0)return flat.slice(0,170);const from=Math.max(0,pos-45);return (from?'…':'')+flat.slice(from,Math.min(flat.length,pos+150))+(pos+150<flat.length?'…':'')}
function markedText(node,raw,terms){if(!terms.length){node.textContent=raw;return}const lower=raw.toLocaleLowerCase('zh-CN');let i=0;while(i<raw.length){let hit=null;for(const term of terms){const p=lower.indexOf(term,i);if(p>=0&&(!hit||p<hit.p))hit={p,len:term.length}}if(!hit){node.append(document.createTextNode(raw.slice(i)));break}node.append(document.createTextNode(raw.slice(i,hit.p)));const m=document.createElement('mark');m.textContent=raw.slice(hit.p,hit.p+hit.len);node.append(m);i=hit.p+hit.len}}
function run(){const raw=q.value.trim();const terms=raw.toLocaleLowerCase('zh-CN').split(/\s+/).filter(Boolean);results.replaceChildren();if(!terms.length&&!cat.value&&!src.value){count.textContent='';const p=document.createElement('p');p.className='empty';p.textContent='输入知识点或选择主题开始检索。';results.append(p);return}let total=0;const limit=60;const frag=document.createDocumentFragment();for(const page of KB_DATA.pages){if(cat.value&&page.c!==cat.value)continue;if(src.value&&page.s!==src.value)continue;const norm=normalize(page.t);if(!terms.every(term=>norm.includes(normalize(term))))continue;total++;if(total>limit)continue;const source=sourceMap[page.s];const item=document.createElement('article');item.className='result';const title=document.createElement('a');title.href=source.uri+'#page='+page.p;title.target='_blank';title.textContent=`${source.name} · ${source.kind==='study-notes'?'讲解':'PDF'} 第 ${page.p} ${source.kind==='study-notes'?'节':'页'}`;const meta=document.createElement('div');meta.className='meta';meta.textContent=`${page.c} · ${source.method}`;const snippet=document.createElement('p');snippet.className='snippet';markedText(snippet,makeSnippet(page.t,terms),terms);item.append(title,meta,snippet);frag.append(item)}results.append(frag);count.textContent=`${total} 项匹配${total>limit?' · 显示前 '+limit+' 项':''}`;if(!total){const p=document.createElement('p');p.className='empty';p.textContent='没有匹配页。试试更短的词，或去掉主题筛选。';results.append(p)}}
q.addEventListener('input',run);cat.addEventListener('change',run);src.addEventListener('change',run);
</script>
</body></html>
