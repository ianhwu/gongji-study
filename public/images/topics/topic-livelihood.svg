<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title"><title id="title">民生、教育科技人才与社会保障知识框架</title><rect width="960" height="556" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">民生、教育科技人才与社会保障</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">社会保险</text><text x="58" y="180" fill="#354256" font-size="18">围绕养老、医疗等社会风险建立保障机制，通常联系</text><text x="58" y="208" fill="#354256" font-size="18">法定参保和缴费制度。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">社会救助</text><text x="514" y="180" fill="#354256" font-size="18">对困难群体提供基本生活等帮助，关注困难程度与救</text><text x="514" y="208" fill="#354256" font-size="18">助条件。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">社会福利与优抚</text><text x="58" y="322" fill="#354256" font-size="18">福利提供相应公共支持；优抚针对法定特定对象，不</text><text x="58" y="350" fill="#354256" font-size="18">能以普通困难程度替代身份条件。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">就业与分配</text><text x="514" y="322" fill="#354256" font-size="18">就业连接居民收入来源；分配制度还要区分初次分配</text><text x="514" y="350" fill="#354256" font-size="18">、再分配等环节。</text><rect x="36" y="400" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">教育、科技、人才</text><text x="58" y="464" fill="#354256" font-size="18">相互支撑，连接人力素质、创新能力与发展动力。</text><text x="36" y="534" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>