<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title"><title id="title">社会保险 · 马克资料专题知识框架</title><rect width="960" height="470" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">社会保险 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">社会统筹与个人账户</text><text x="58" y="180" fill="#354256" font-size="18">基本养老保险实行社会统筹与个人账户相结合。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">工伤、生育</text><text x="514" y="180" fill="#354256" font-size="18">职工工伤保险费由用人单位缴纳，职工个人不缴纳工</text><text x="514" y="208" fill="#354256" font-size="18">伤保险费。</text><rect x="36" y="258" width="432" height="148" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">一年</text><text x="58" y="322" fill="#354256" font-size="18">领取失业保险金要求失业前用人单位和本人已缴纳失</text><text x="58" y="350" fill="#354256" font-size="18">业保险费满一年等条件。</text><rect x="492" y="258" width="432" height="148" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">第三人</text><text x="514" y="322" fill="#354256" font-size="18">应由第三人负担的医疗费用原则上不纳入基本医保支</text><text x="514" y="350" fill="#354256" font-size="18">付；第三人不支付或无法确定时可依法先行支付并追</text><text x="514" y="378" fill="#354256" font-size="18">偿。</text><text x="36" y="448" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>