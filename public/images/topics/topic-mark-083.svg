<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title"><title id="title">纪要 · 马克资料专题知识框架</title><rect width="960" height="414" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">纪要 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">议定事项</text><text x="58" y="180" fill="#354256" font-size="18">纪要适用于记载会议主要情况和议定事项。</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">多向行文</text><text x="514" y="180" fill="#354256" font-size="18">纪要可根据会议和工作需要采用不同的行文方向。</text><rect x="36" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">提炼</text><text x="58" y="294" fill="#354256" font-size="18">纪要需提炼会议主要情况和议定事项，会议记录则更</text><text x="58" y="322" fill="#354256" font-size="18">注重如实记录过程。</text><rect x="492" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">第三人称</text><text x="514" y="294" fill="#354256" font-size="18">纪要常用第三人称，以会议认为、会议指出、会议要</text><text x="514" y="322" fill="#354256" font-size="18">求等组织内容。</text><text x="36" y="392" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>