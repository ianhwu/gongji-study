<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">航天首次 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">航天首次 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">加加林</text><text x="58" y="180" fill="#354256" font-size="18">加加林是世界上第一位进入太空的航天员。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">阿姆斯特朗</text><text x="514" y="180" fill="#354256" font-size="18">阿姆斯特朗在阿波罗11号任务中成为首位踏上月球</text><text x="514" y="208" fill="#354256" font-size="18">的人。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">杨利伟</text><text x="58" y="322" fill="#354256" font-size="18">杨利伟于2003年乘神舟五号成为中国首位进入太空</text><text x="58" y="350" fill="#354256" font-size="18">的航天员。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">翟志刚</text><text x="514" y="322" fill="#354256" font-size="18">翟志刚在神舟七号任务中完成中国首次太空行走。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>