<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">票据 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">票据 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">汇票、本票和支票</text><text x="58" y="180" fill="#354256" font-size="18">我国票据法规定的票据包括汇票、本票和支票。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">承诺自己</text><text x="514" y="180" fill="#354256" font-size="18">本票由出票人承诺自己在见票时无条件支付确定金额</text><text x="514" y="208" fill="#354256" font-size="18">。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">十日</text><text x="58" y="322" fill="#354256" font-size="18">同城支票的持票人应自出票日起十日内提示付款。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">连带</text><text x="514" y="322" fill="#354256" font-size="18">汇票出票人、背书人、承兑人和保证人对持票人承担</text><text x="514" y="350" fill="#354256" font-size="18">连带责任。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>