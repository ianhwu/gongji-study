<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">中国特色社会主义理论与基本路线知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">中国特色社会主义理论与基本路线</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">邓小平理论</text><text x="58" y="180" fill="#354256" font-size="18">围绕什么是社会主义、怎样建设社会主义等问题展开</text><text x="58" y="208" fill="#354256" font-size="18">，联系改革开放实践。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">三个代表重要思想</text><text x="514" y="180" fill="#354256" font-size="18">联系建设什么样的党、怎样建设党的问题。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">科学发展观</text><text x="58" y="322" fill="#354256" font-size="18">围绕实现什么样的发展、怎样发展，重视以人为本、</text><text x="58" y="350" fill="#354256" font-size="18">全面协调可持续。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">初级阶段基本路线</text><text x="514" y="322" fill="#354256" font-size="18">以经济建设为中心，坚持四项基本原则，坚持改革开</text><text x="514" y="350" fill="#354256" font-size="18">放。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">道路、理论、制度、文化</text><text x="58" y="464" fill="#354256" font-size="18">分别关注实现路径、行动指南、制度保障与精神力量</text><text x="58" y="492" fill="#354256" font-size="18">，相互联系。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>