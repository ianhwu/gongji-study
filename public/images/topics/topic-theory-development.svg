<svg xmlns="http://www.w3.org/2000/svg" width="960" height="668" viewBox="0 0 960 668" role="img" aria-labelledby="title"><title id="title">中国特色社会主义理论与基本路线知识框架</title><rect width="960" height="668" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">中国特色社会主义理论与基本路线</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="148" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">邓小平理论</text><text x="58" y="180" fill="#354256" font-size="18">围绕什么是社会主义、怎样建设社会主义等问题展开</text><text x="58" y="208" fill="#354256" font-size="18">，联系改革开放实践。</text><rect x="492" y="116" width="432" height="148" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">三个代表重要思想</text><text x="514" y="180" fill="#354256" font-size="18">代表中国先进生产力的发展要求、中国先进文化的前</text><text x="514" y="208" fill="#354256" font-size="18">进方向、中国最广大人民的根本利益；回答建设什么</text><text x="514" y="236" fill="#354256" font-size="18">样的党、怎样建设党的问题。</text><rect x="36" y="286" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="318" fill="#24599b" font-size="20" font-weight="700">科学发展观</text><text x="58" y="350" fill="#354256" font-size="18">围绕实现什么样的发展、怎样发展，重视以人为本、</text><text x="58" y="378" fill="#354256" font-size="18">全面协调可持续。</text><rect x="492" y="286" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="318" fill="#24599b" font-size="20" font-weight="700">初级阶段基本路线</text><text x="514" y="350" fill="#354256" font-size="18">以经济建设为中心，坚持四项基本原则，坚持改革开</text><text x="514" y="378" fill="#354256" font-size="18">放。</text><rect x="36" y="428" width="432" height="176" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="460" fill="#24599b" font-size="20" font-weight="700">四项基本原则</text><text x="58" y="492" fill="#354256" font-size="18">坚持社会主义道路、坚持人民民主专政、坚持中国共</text><text x="58" y="520" fill="#354256" font-size="18">产党的领导、坚持马克思列宁主义毛泽东思想。对应</text><text x="58" y="548" fill="#354256" font-size="18">道路、国体、领导、指导思想四方面；改革开放不在</text><text x="58" y="576" fill="#354256" font-size="18">这四项之中。</text><rect x="492" y="428" width="432" height="176" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="460" fill="#24599b" font-size="20" font-weight="700">道路、理论、制度、文化</text><text x="514" y="492" fill="#354256" font-size="18">分别关注实现路径、行动指南、制度保障与精神力量</text><text x="514" y="520" fill="#354256" font-size="18">，相互联系。</text><text x="36" y="646" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>