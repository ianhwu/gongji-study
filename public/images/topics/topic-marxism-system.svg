<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">马克思主义体系与哲学基本问题知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">马克思主义体系与哲学基本问题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">三部分</text><text x="58" y="180" fill="#354256" font-size="18">马克思主义哲学、马克思主义政治经济学、科学社会</text><text x="58" y="208" fill="#354256" font-size="18">主义相互联系。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">理论来源</text><text x="514" y="180" fill="#354256" font-size="18">德国古典哲学、英国古典政治经济学、英法空想社会</text><text x="514" y="208" fill="#354256" font-size="18">主义，分别理解其贡献。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">基本问题第一方面</text><text x="58" y="322" fill="#354256" font-size="18">思维与存在何者第一性，据此区分唯物主义与唯心主</text><text x="58" y="350" fill="#354256" font-size="18">义。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">基本问题第二方面</text><text x="514" y="322" fill="#354256" font-size="18">思维能否认识存在，涉及可知论与不可知论。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">实践品格</text><text x="58" y="464" fill="#354256" font-size="18">从实践出发认识世界与改造世界，实践性贯穿理论与</text><text x="58" y="492" fill="#354256" font-size="18">现实联系。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>