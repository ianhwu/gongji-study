<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title"><title id="title">国际经济组织与金融机构知识框架</title><rect width="960" height="414" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">国际经济组织与金融机构</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">WTO</text><text x="58" y="180" fill="#354256" font-size="18">世界贸易组织，关注国际贸易规则与相关合作。</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">IMF</text><text x="514" y="180" fill="#354256" font-size="18">国际货币基金组织，关注国际货币金融合作等。</text><rect x="36" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">中央银行</text><text x="58" y="294" fill="#354256" font-size="18">我国中国人民银行履行中央银行职责，与商业银行不</text><text x="58" y="322" fill="#354256" font-size="18">同。</text><rect x="492" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">经济全球化</text><text x="514" y="294" fill="#354256" font-size="18">贸易、投资、生产等跨国联系，不能等同于所有国家</text><text x="514" y="322" fill="#354256" font-size="18">发展水平一致。</text><text x="36" y="392" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>