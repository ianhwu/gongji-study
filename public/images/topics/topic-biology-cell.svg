<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">细胞结构、遗传与能量转换知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">细胞结构、遗传与能量转换</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">细胞核与遗传</text><text x="58" y="180" fill="#354256" font-size="18">细胞核通常联系遗传信息与细胞活动调控；DNA是重</text><text x="58" y="208" fill="#354256" font-size="18">要遗传物质。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">线粒体</text><text x="514" y="180" fill="#354256" font-size="18">联系有氧呼吸等能量转换过程，不应直接称为制造一</text><text x="514" y="208" fill="#354256" font-size="18">切能量。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">叶绿体</text><text x="58" y="322" fill="#354256" font-size="18">联系植物等的光合作用；不是植物每种细胞都有叶绿</text><text x="58" y="350" fill="#354256" font-size="18">体。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">液泡等结构</text><text x="514" y="322" fill="#354256" font-size="18">结合植物细胞特点、储存与渗透等功能理解。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">血细胞</text><text x="58" y="464" fill="#354256" font-size="18">红细胞、白细胞、血小板分别联系运输、防御和止血</text><text x="58" y="492" fill="#354256" font-size="18">等功能。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>