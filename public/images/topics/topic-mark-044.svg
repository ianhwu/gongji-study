<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title"><title id="title">三大起义、三湾改编与古田会议 · 马克资料专题知识框架</title><rect width="960" height="414" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">三大起义、三湾改编与古田会议 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">1927</text><text x="58" y="180" fill="#354256" font-size="18">南昌起义、秋收起义、广州起义均发生在1927年。</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">8 月 1 日</text><text x="514" y="180" fill="#354256" font-size="18">南昌起义发生于1927年8月1日。</text><rect x="36" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">党支部建在连上</text><text x="58" y="294" fill="#354256" font-size="18">三湾改编提出党支部建在连上，从组织上确立党对军</text><text x="58" y="322" fill="#354256" font-size="18">队的领导。</text><rect x="492" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">思想建党</text><text x="514" y="294" fill="#354256" font-size="18">古田会议确立思想建党、政治建军原则。</text><text x="36" y="392" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>