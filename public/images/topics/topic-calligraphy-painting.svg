<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">书法、绘画与舞台艺术看图对照知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">书法、绘画与舞台艺术看图对照</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">篆与隶</text><text x="58" y="180" fill="#354256" font-size="18">篆书观察匀整线条与结构；隶书观察横势、波磔等，</text><text x="58" y="208" fill="#354256" font-size="18">不以单一笔画代替整字判断。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">楷、行、草</text><text x="514" y="180" fill="#354256" font-size="18">楷书结构规整，行书介于楷草之间，草书省连较多；</text><text x="514" y="208" fill="#354256" font-size="18">具体字例仍需辨认。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">绘画题材</text><text x="58" y="322" fill="#354256" font-size="18">山水、人物、花鸟、风俗等按对象区分；作品作者、</text><text x="58" y="350" fill="#354256" font-size="18">时代、画种分列记忆。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">戏曲表演</text><text x="514" y="322" fill="#354256" font-size="18">唱念做打是基本功；剧种、剧目、作者、角色行当分</text><text x="514" y="350" fill="#354256" font-size="18">别核对。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>