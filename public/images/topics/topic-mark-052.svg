<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">台湾 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">台湾 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">1979</text><text x="58" y="180" fill="#354256" font-size="18">1979年《告台湾同胞书》宣布和平统一祖国的大政</text><text x="58" y="208" fill="#354256" font-size="18">方针。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">九二共识</text><text x="514" y="180" fill="#354256" font-size="18">九二共识体现一个中国原则。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">反分裂国家法</text><text x="58" y="322" fill="#354256" font-size="18">《反分裂国家法》于2005年通过。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">一个中国</text><text x="514" y="322" fill="#354256" font-size="18">大陆和台湾同属一个中国，中国的主权和领土完整不</text><text x="514" y="350" fill="#354256" font-size="18">容分割。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>