<svg xmlns="http://www.w3.org/2000/svg" width="960" height="956" viewBox="0 0 960 956" role="img" aria-labelledby="title"><title id="title">中国古代史：制度、人物与社会变迁知识框架</title><rect width="960" height="956" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">中国古代史：制度、人物与社会变迁</text><text x="36" y="86" fill="#576579" font-size="17">按时间排列；各节点的背景与影响需分别理解。</text><rect x="36" y="116" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">史前材料</text><text x="58" y="180" fill="#354256" font-size="18">旧石器时代典型联系打制石器，新石器时代联系磨制及农业等发展，具体遗址另核对。</text><rect x="36" y="230" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">夏商周</text><text x="58" y="294" fill="#354256" font-size="18">世袭、分封、宗法等制度分别联系王位、地方秩序和宗族关系；甲骨文关联商代文字材料。</text><rect x="36" y="344" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="376" fill="#24599b" font-size="20" font-weight="700">秦汉</text><text x="58" y="408" fill="#354256" font-size="18">秦统一强化中央集权；地方郡县制、汉代察举等从治理与选官方向区分。</text><rect x="36" y="458" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="490" fill="#24599b" font-size="20" font-weight="700">魏晋至隋唐</text><text x="58" y="522" fill="#354256" font-size="18">九品中正制、科举发展，隋唐三省六部制联系中央政务分工。</text><rect x="36" y="572" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="604" fill="#24599b" font-size="20" font-weight="700">元代</text><text x="58" y="636" fill="#354256" font-size="18">行省制度联系地方行政管理；不能与中央三省六部同列为同一类别。</text><rect x="36" y="686" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="718" fill="#24599b" font-size="20" font-weight="700">交流与文明</text><text x="58" y="750" fill="#354256" font-size="18">张骞出使、西域交通与丝绸之路联系政治交往和经济文化交流。</text><rect x="36" y="800" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="832" fill="#24599b" font-size="20" font-weight="700">明清交替背景</text><text x="58" y="864" fill="#354256" font-size="18">1619年萨尔浒战役联系明与后金的军事冲突，按时代和交战双方辨认。</text><text x="36" y="934" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>