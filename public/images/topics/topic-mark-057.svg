<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title"><title id="title">新疆 · 马克资料专题知识框架</title><rect width="960" height="414" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">新疆 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">三山夹两盆</text><text x="58" y="180" fill="#354256" font-size="18">新疆主要地形格局可概括为三山夹两盆。</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">塔里木河</text><text x="514" y="180" fill="#354256" font-size="18">塔里木河是我国最长的内流河。</text><rect x="36" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">额尔齐斯河</text><text x="58" y="294" fill="#354256" font-size="18">额尔齐斯河流域属于北冰洋水系。</text><rect x="492" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">西域都护</text><text x="514" y="294" fill="#354256" font-size="18">西汉设立西域都护府，标志西域正式纳入中央王朝管</text><text x="514" y="322" fill="#354256" font-size="18">辖。</text><text x="36" y="392" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>