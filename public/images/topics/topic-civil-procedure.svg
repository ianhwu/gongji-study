<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">民事诉讼：当事人、回避与裁判知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">民事诉讼：当事人、回避与裁判</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">原告与被告</text><text x="58" y="180" fill="#354256" font-size="18">围绕具体民事争议的诉讼主体，区别于审判人员。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">回避</text><text x="514" y="180" fill="#354256" font-size="18">保障中立与公正，关注人员与案件或当事人的法定关</text><text x="514" y="208" fill="#354256" font-size="18">系。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">判决与裁定</text><text x="58" y="322" fill="#354256" font-size="18">判决通常处理实体争议，裁定主要处理法定程序事项</text><text x="58" y="350" fill="#354256" font-size="18">等，注意具体适用范围。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">程序路径</text><text x="514" y="322" fill="#354256" font-size="18">起诉、受理、审理、裁判、救济分别承担不同任务。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>