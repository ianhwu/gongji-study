<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">契税、城建税与印花税 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">契税、城建税与印花税 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">承受</text><text x="58" y="180" fill="#354256" font-size="18">在境内转移土地、房屋权属时，承受权属的单位和个</text><text x="58" y="208" fill="#354256" font-size="18">人是契税纳税人。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">百分之三至百分之五</text><text x="514" y="180" fill="#354256" font-size="18">契税法规定的法定税率幅度为3%至5%。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">百分之七</text><text x="58" y="322" fill="#354256" font-size="18">城市维护建设税纳税人所在地在市区的，法定税率为</text><text x="58" y="350" fill="#354256" font-size="18">7%。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">出让方</text><text x="514" y="322" fill="#354256" font-size="18">证券交易印花税对证券交易的出让方征收，不对受让</text><text x="514" y="350" fill="#354256" font-size="18">方征收。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>