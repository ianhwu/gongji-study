<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title"><title id="title">行政组织与行政决策 · 马克资料专题知识框架</title><rect width="960" height="414" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">行政组织与行政决策 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">程序化</text><text x="58" y="180" fill="#354256" font-size="18">对重复出现、已有明确处理规则的问题，可采取程序</text><text x="58" y="208" fill="#354256" font-size="18">化决策。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">经济职能</text><text x="514" y="180" fill="#354256" font-size="18">宏观调控、提供公共产品和服务、市场监管属于政府</text><text x="514" y="208" fill="#354256" font-size="18">经济职能。</text><rect x="36" y="258" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">管理幅度</text><text x="58" y="322" fill="#354256" font-size="18">管理幅度通常指一个管理者直接管理的下属数量。</text><rect x="492" y="258" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">科学决策</text><text x="514" y="322" fill="#354256" font-size="18">科学决策重视运用科学方法和系统分析形成方案。</text><text x="36" y="392" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>