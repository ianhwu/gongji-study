<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">人民民主、国家制度与法治建设知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">人民民主、国家制度与法治建设</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">人民代表大会制度</text><text x="58" y="180" fill="#354256" font-size="18">我国的根本政治制度，联系人民行使国家权力的组织</text><text x="58" y="208" fill="#354256" font-size="18">方式。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">基本政治制度</text><text x="514" y="180" fill="#354256" font-size="18">包括中国共产党领导的多党合作和政治协商制度、民</text><text x="514" y="208" fill="#354256" font-size="18">族区域自治制度、基层群众自治制度。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">民主参与</text><text x="58" y="322" fill="#354256" font-size="18">民主选举、民主协商、民主决策、民主管理、民主监</text><text x="58" y="350" fill="#354256" font-size="18">督相互贯通。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">法治环节</text><text x="514" y="322" fill="#354256" font-size="18">科学立法、严格执法、公正司法、全民守法，分别连</text><text x="514" y="350" fill="#354256" font-size="18">接主体与行为。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>