<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title"><title id="title">革命任务与新中国外交方针知识框架</title><rect width="960" height="414" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">革命任务与新中国外交方针</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">革命任务</text><text x="58" y="180" fill="#354256" font-size="18">新民主主义革命联系反帝反封建的历史任务。</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">土地问题</text><text x="514" y="180" fill="#354256" font-size="18">解决农民土地问题与革命群众基础相联系。</text><rect x="36" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">另起炉灶</text><text x="58" y="294" fill="#354256" font-size="18">不承认旧的屈辱外交关系，在新基础上建立外交关系</text><text x="58" y="322" fill="#354256" font-size="18">。</text><rect x="492" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">独立自主</text><text x="514" y="294" fill="#354256" font-size="18">立足国家主权与本国实际，区别于闭关自守。</text><text x="36" y="392" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>