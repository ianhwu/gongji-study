<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">组织结构、管理幅度与管理技能知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">组织结构、管理幅度与管理技能</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">管理幅度</text><text x="58" y="180" fill="#354256" font-size="18">一名管理者直接管理的下属数量；与层次关系分析需</text><text x="58" y="208" fill="#354256" font-size="18">结合组织规模等条件。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">管理层次</text><text x="514" y="180" fill="#354256" font-size="18">纵向层级，增加层次可能增加信息传递环节。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">技术、人际、概念技能</text><text x="58" y="322" fill="#354256" font-size="18">分别侧重具体业务、合作沟通和整体分析，不同层级</text><text x="58" y="350" fill="#354256" font-size="18">重点不同。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">行政组织类型</text><text x="514" y="322" fill="#354256" font-size="18">按职责辨认领导、职能、辅助、参谋等，具体权限须</text><text x="514" y="350" fill="#354256" font-size="18">有组织依据。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">公共产品与事业单位</text><text x="58" y="464" fill="#354256" font-size="18">公共产品按竞争性和排他性辨认；事业单位按组织性</text><text x="58" y="492" fill="#354256" font-size="18">质、职责任务及规则判断。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>