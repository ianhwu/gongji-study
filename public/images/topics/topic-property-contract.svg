<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">物权、合同与担保知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">物权、合同与担保</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">物权</text><text x="58" y="180" fill="#354256" font-size="18">所有权、用益物权、担保物权分别关注归属、利用和</text><text x="58" y="208" fill="#354256" font-size="18">债权保障。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">用益物权</text><text x="514" y="180" fill="#354256" font-size="18">重点在依法占有、使用、收益他人的物，联系土地等</text><text x="514" y="208" fill="#354256" font-size="18">制度。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">留置与担保</text><text x="58" y="322" fill="#354256" font-size="18">以财产保障债权实现，适用条件必须结合具体条文。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">合同</text><text x="514" y="322" fill="#354256" font-size="18">成立、效力、履行、违约是不同阶段，不能将合同成</text><text x="514" y="350" fill="#354256" font-size="18">立等同于所有权必然转移。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>