<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">中国地理：地形、水系与区域联系知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">中国地理：地形、水系与区域联系</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">地势与地形</text><text x="58" y="180" fill="#354256" font-size="18">三级阶梯及主要高原、盆地、平原结合地图定位。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">水系</text><text x="514" y="180" fill="#354256" font-size="18">河流源地、流向、流域与入海口连成一条线；湖泊按</text><text x="514" y="208" fill="#354256" font-size="18">位置与性质比较。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">秦岭—淮河</text><text x="58" y="322" fill="#354256" font-size="18">联系多项地理分界，但不同指标仍有具体口径与范围</text><text x="58" y="350" fill="#354256" font-size="18">。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">农业与气候</text><text x="514" y="322" fill="#354256" font-size="18">热量、水分、地形及土壤共同影响农业，避免单因素</text><text x="514" y="350" fill="#354256" font-size="18">判断。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">典型景观</text><text x="58" y="464" fill="#354256" font-size="18">湖泊、峡谷、瀑布、沙漠各有形成条件，图片与地图</text><text x="58" y="492" fill="#354256" font-size="18">应对读。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>