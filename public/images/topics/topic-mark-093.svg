<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">社会主义建设与活的灵魂 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">社会主义建设与活的灵魂 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">实事求是</text><text x="58" y="180" fill="#354256" font-size="18">实事求是、群众路线、独立自主是毛泽东思想活的灵</text><text x="58" y="208" fill="#354256" font-size="18">魂。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">两类</text><text x="514" y="180" fill="#354256" font-size="18">社会主义社会中存在敌我矛盾和人民内部矛盾，两类</text><text x="514" y="208" fill="#354256" font-size="18">性质不同。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">团结</text><text x="58" y="322" fill="#354256" font-size="18">处理人民内部矛盾常用团结—批评—团结的方法。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">经济建设</text><text x="514" y="322" fill="#354256" font-size="18">《论十大关系》围绕调动国内外一切积极因素为社会</text><text x="514" y="350" fill="#354256" font-size="18">主义事业服务展开。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>