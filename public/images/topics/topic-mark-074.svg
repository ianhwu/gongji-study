<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">股票与有价证券 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">股票与有价证券 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">资本证券</text><text x="58" y="180" fill="#354256" font-size="18">股票、债券通常归资本证券，汇票、本票、支票通常</text><text x="58" y="208" fill="#354256" font-size="18">归货币证券。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">一级市场</text><text x="514" y="180" fill="#354256" font-size="18">证券一级市场是发行市场，二级市场是已发行证券的</text><text x="514" y="208" fill="#354256" font-size="18">交易市场。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">所有权</text><text x="58" y="322" fill="#354256" font-size="18">股票主要体现股权，债券主要体现债权。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">代销</text><text x="514" y="322" fill="#354256" font-size="18">代销中未售出的证券按约定退还发行人，包销由承销</text><text x="514" y="350" fill="#354256" font-size="18">商依约承担未售出证券。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>