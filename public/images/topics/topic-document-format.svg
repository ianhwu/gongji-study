<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">公文格式与办理流程知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">公文格式与办理流程</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">法定作者</text><text x="58" y="180" fill="#354256" font-size="18">依法制发公文的机关或组织，与实际执笔起草人员不</text><text x="58" y="208" fill="#354256" font-size="18">同。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">标题与字号</text><text x="514" y="180" fill="#354256" font-size="18">标题识别机关、事由、文种；发文字号识别机关代字</text><text x="514" y="208" fill="#354256" font-size="18">、年份、顺序号。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">日期与签发</text><text x="58" y="322" fill="#354256" font-size="18">成文日期联系会议通过或负责人签发，联合行文另核</text><text x="58" y="350" fill="#354256" font-size="18">对最后签发日期。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">拟制</text><text x="514" y="322" fill="#354256" font-size="18">起草、审核、签发，重点检查依据、内容、文种与格</text><text x="514" y="350" fill="#354256" font-size="18">式。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">办理</text><text x="58" y="464" fill="#354256" font-size="18">收文、发文及整理归档；收文中注意签收、登记、初</text><text x="58" y="492" fill="#354256" font-size="18">审、承办等环节。</text><rect x="492" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="432" fill="#24599b" font-size="20" font-weight="700">管理</text><text x="514" y="464" fill="#354256" font-size="18">包含保密、流转、存档等要求，确保规范与责任可追</text><text x="514" y="492" fill="#354256" font-size="18">溯。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>