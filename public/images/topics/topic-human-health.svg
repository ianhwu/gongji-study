<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">人体结构、营养与健康常识知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">人体结构、营养与健康常识</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">消化与营养</text><text x="58" y="180" fill="#354256" font-size="18">消化道与消化腺分工，糖类、脂肪、蛋白质等功能不</text><text x="58" y="208" fill="#354256" font-size="18">同。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">循环与呼吸</text><text x="514" y="180" fill="#354256" font-size="18">动脉静脉按血流方向定义，肺循环中含氧情况不能机</text><text x="514" y="208" fill="#354256" font-size="18">械套用。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">神经与感觉</text><text x="58" y="322" fill="#354256" font-size="18">脊髓及感觉整合等参与生理活动，眩晕可联系不同感</text><text x="58" y="350" fill="#354256" font-size="18">觉信息的冲突。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">免疫与病原</text><text x="514" y="322" fill="#354256" font-size="18">疫苗与特异性免疫相联系，不同传染病病原、传播途</text><text x="514" y="350" fill="#354256" font-size="18">径需分别核对。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>