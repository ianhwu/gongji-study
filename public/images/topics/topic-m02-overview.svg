<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title"><title id="title">民法知识框架知识框架</title><rect width="960" height="500" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">民法知识框架</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">权利能力</text><text x="58" y="180" fill="#354256" font-size="18">资格；通常始于出生、终于死亡</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">行为能力</text><text x="514" y="180" fill="#354256" font-size="18">独立实施行为的能力；按年龄和辨认能力分类</text><rect x="36" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">物权</text><text x="58" y="294" fill="#354256" font-size="18">直接支配特定物；关注物、权利种类、公示</text><rect x="492" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">债权</text><text x="514" y="294" fill="#354256" font-size="18">请求特定人履行；关注合同、履行、违约等</text><rect x="36" y="344" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="376" fill="#24599b" font-size="20" font-weight="700">无效与可撤销</text><text x="58" y="408" fill="#354256" font-size="18">不同效力状态；不能把所有意思表示瑕疵都判为无效</text><text x="36" y="478" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>