<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">物质、意识与一切从实际出发知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">物质、意识与一切从实际出发</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">物质</text><text x="58" y="180" fill="#354256" font-size="18">不依赖人的意识而存在，并能为人的意识所反映，强</text><text x="58" y="208" fill="#354256" font-size="18">调客观实在性。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">意识</text><text x="514" y="180" fill="#354256" font-size="18">是人脑对客观存在的反映，受客观条件制约，也具有</text><text x="514" y="208" fill="#354256" font-size="18">能动作用。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">尊重规律</text><text x="58" y="322" fill="#354256" font-size="18">规律具有客观性，能够被认识与利用，但不能随意制</text><text x="58" y="350" fill="#354256" font-size="18">造或消灭。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">发挥能动性</text><text x="514" y="322" fill="#354256" font-size="18">通过目的、计划和实践活动认识、改造世界，效果受</text><text x="514" y="350" fill="#354256" font-size="18">到客观条件制约。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>