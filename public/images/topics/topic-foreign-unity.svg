<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title"><title id="title">祖国统一与外交基本准则知识框架</title><rect width="960" height="414" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">祖国统一与外交基本准则</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">一国两制</text><text x="58" y="180" fill="#354256" font-size="18">一国是前提和基础，两制在统一国家内实行。</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">祖国统一</text><text x="514" y="180" fill="#354256" font-size="18">联系和平统一、一国两制等方针与主权原则。</text><rect x="36" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">和平共处五项原则</text><text x="58" y="294" fill="#354256" font-size="18">互相尊重主权和领土完整、互不侵犯、互不干涉内政</text><text x="58" y="322" fill="#354256" font-size="18">、平等互利、和平共处。</text><rect x="492" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">和平发展</text><text x="514" y="294" fill="#354256" font-size="18">联系合作与共同发展，区别于放弃维护自身主权和安</text><text x="514" y="322" fill="#354256" font-size="18">全。</text><text x="36" y="392" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>