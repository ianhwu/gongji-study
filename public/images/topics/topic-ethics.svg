<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title"><title id="title">公民道德、职业道德与文明礼仪知识框架</title><rect width="960" height="556" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">公民道德、职业道德与文明礼仪</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">核心与原则</text><text x="58" y="180" fill="#354256" font-size="18">社会主义道德建设以为人民服务为核心、以集体主义</text><text x="58" y="208" fill="#354256" font-size="18">为原则。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">社会公德</text><text x="514" y="180" fill="#354256" font-size="18">关注公共生活中的文明礼貌、助人为乐、保护环境、</text><text x="514" y="208" fill="#354256" font-size="18">遵纪守法等。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">职业道德</text><text x="58" y="322" fill="#354256" font-size="18">关注职业活动中的爱岗敬业、诚实守信、办事公道、</text><text x="58" y="350" fill="#354256" font-size="18">服务群众、奉献社会等。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">家庭美德</text><text x="514" y="322" fill="#354256" font-size="18">关注家庭成员关系、尊老爱幼、平等和睦、勤俭等。</text><rect x="36" y="400" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">个人品德</text><text x="58" y="464" fill="#354256" font-size="18">关注个人道德品质与日常自觉养成。</text><text x="36" y="534" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>