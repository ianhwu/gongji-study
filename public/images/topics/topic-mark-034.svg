<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title"><title id="title">考古 · 马克资料专题知识框架</title><rect width="960" height="414" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">考古 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">仰韶</text><text x="58" y="180" fill="#354256" font-size="18">仰韶文化属于新石器时代，彩陶是其代表性文化特征</text><text x="58" y="208" fill="#354256" font-size="18">。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">贾湖</text><text x="514" y="180" fill="#354256" font-size="18">河南贾湖遗址出土了著名的骨笛。</text><rect x="36" y="258" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">马王堆</text><text x="58" y="322" fill="#354256" font-size="18">素纱襌衣出土于长沙马王堆汉墓。</text><rect x="492" y="258" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">睡虎地</text><text x="514" y="322" fill="#354256" font-size="18">云梦睡虎地秦墓竹简是研究秦代制度的重要材料。</text><text x="36" y="392" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>