<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">大气、天气气候与自然灾害知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">大气、天气气候与自然灾害</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">大气分层</text><text x="58" y="180" fill="#354256" font-size="18">对流层、平流层等按高度与特点辨认；日常天气主要</text><text x="58" y="208" fill="#354256" font-size="18">发生在对流层。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">锋面</text><text x="514" y="180" fill="#354256" font-size="18">冷暖气团主动移动方向决定冷锋、暖锋。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">气象灾害</text><text x="58" y="322" fill="#354256" font-size="18">台风、干旱等联系气压、风、水汽和气候条件。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">地质与水文</text><text x="514" y="322" fill="#354256" font-size="18">地震、洪水等分别分析成因，不能按名称相近归为一</text><text x="514" y="350" fill="#354256" font-size="18">类。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>