<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title"><title id="title">电影与世界奖项 · 马克资料专题知识框架</title><rect width="960" height="414" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">电影与世界奖项 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">戛纳</text><text x="58" y="180" fill="#354256" font-size="18">戛纳电影节的最高奖通常称金棕榈奖</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">柏林</text><text x="514" y="180" fill="#354256" font-size="18">柏林电影节的最高奖通常称金熊奖</text><rect x="36" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">威尼斯</text><text x="58" y="294" fill="#354256" font-size="18">威尼斯电影节的最高奖通常称金狮奖</text><rect x="492" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">金熊奖</text><text x="514" y="294" fill="#354256" font-size="18">柏林国际电影节主要奖项为金熊奖，威尼斯对应金狮</text><text x="514" y="322" fill="#354256" font-size="18">奖，戛纳对应金棕榈奖。</text><text x="36" y="392" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>