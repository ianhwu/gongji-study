<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">生物分类、生态系统与生物技术知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">生物分类、生态系统与生物技术</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">分类层级</text><text x="58" y="180" fill="#354256" font-size="18">界、门、纲、目、科、属、种等传统层级从大到小，</text><text x="58" y="208" fill="#354256" font-size="18">具体分类体系还须结合材料。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">生态系统</text><text x="514" y="180" fill="#354256" font-size="18">生物部分与非生物环境共同构成，生产者、消费者、</text><text x="514" y="208" fill="#354256" font-size="18">分解者承担不同角色。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">物质与能量</text><text x="58" y="322" fill="#354256" font-size="18">物质循环与能量流动相联系，能量在营养级传递中存</text><text x="58" y="350" fill="#354256" font-size="18">在损耗。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">人体营养</text><text x="514" y="322" fill="#354256" font-size="18">蛋白质、脂类、糖类、维生素、无机盐等作用不同，</text><text x="514" y="350" fill="#354256" font-size="18">缺乏与过量都要结合条件。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">生物技术</text><text x="58" y="464" fill="#354256" font-size="18">克隆、遗传工程等按原理区分，不能仅因都涉及DNA</text><text x="58" y="492" fill="#354256" font-size="18">就视为同一技术。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>