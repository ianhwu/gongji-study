<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">英国文化 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">英国文化 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">四大悲剧</text><text x="58" y="180" fill="#354256" font-size="18">《哈姆雷特》《奥赛罗》《李尔王》《麦克白》是莎</text><text x="58" y="208" fill="#354256" font-size="18">士比亚四大悲剧。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">简爱</text><text x="514" y="180" fill="#354256" font-size="18">《简爱》作者是夏洛蒂·勃朗特，《呼啸山庄》作者</text><text x="514" y="208" fill="#354256" font-size="18">是艾米莉·勃朗特。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">双城记</text><text x="58" y="322" fill="#354256" font-size="18">狄更斯《双城记》中的双城指伦敦与巴黎。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">鲁滨逊</text><text x="514" y="322" fill="#354256" font-size="18">《鲁滨逊漂流记》作者为笛福，《格列佛游记》作者</text><text x="514" y="350" fill="#354256" font-size="18">为斯威夫特。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>