<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">军事战略 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">军事战略 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">敌进我退</text><text x="58" y="180" fill="#354256" font-size="18">红军游击战十六字诀为敌进我退、敌驻我扰、敌疲我</text><text x="58" y="208" fill="#354256" font-size="18">打、敌退我追。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">论持久战</text><text x="514" y="180" fill="#354256" font-size="18">《论持久战》提出抗日战争将经过战略防御、战略相</text><text x="514" y="208" fill="#354256" font-size="18">持、战略反攻三个阶段。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">军队政治工作</text><text x="58" y="322" fill="#354256" font-size="18">官兵一致、军民一致、瓦解敌军是军队政治工作的三</text><text x="58" y="350" fill="#354256" font-size="18">大原则。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">十大军事原则</text><text x="514" y="322" fill="#354256" font-size="18">集中优势兵力打歼灭战是解放战争时期十大军事原则</text><text x="514" y="350" fill="#354256" font-size="18">的重要内容。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>