<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">法的五种规范作用知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">法的五种规范作用</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">指引</text><text x="58" y="180" fill="#354256" font-size="18">对象是自己的行为：告诉本人可以做、应当做或不得</text><text x="58" y="208" fill="#354256" font-size="18">做什么。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">评价</text><text x="514" y="180" fill="#354256" font-size="18">对象是他人的行为：依据法律判断是否合法。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">预测</text><text x="58" y="322" fill="#354256" font-size="18">对象是相互之间的行为：预先估计双方会怎样行动。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">教育</text><text x="514" y="322" fill="#354256" font-size="18">通过法律实施影响一般人的认识与行为，具有示范和</text><text x="514" y="350" fill="#354256" font-size="18">警示意义。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">强制</text><text x="58" y="464" fill="#354256" font-size="18">运用国家强制力制裁违法行为，使规范获得最终保障</text><text x="58" y="492" fill="#354256" font-size="18">。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>