<svg xmlns="http://www.w3.org/2000/svg" width="960" height="386" viewBox="0 0 960 386" role="img" aria-labelledby="title"><title id="title">长征 · 马克资料专题知识框架</title><rect width="960" height="386" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">长征 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">1935.1</text><text x="58" y="180" fill="#354256" font-size="18">遵义会议于1935年1月在长征途中召开。</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">四渡赤水</text><text x="514" y="180" fill="#354256" font-size="18">四渡赤水在遵义会议之后，巧渡金沙江在其后。</text><rect x="36" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">吴起</text><text x="58" y="294" fill="#354256" font-size="18">中央红军于1935年到达陕北吴起镇。</text><rect x="492" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">会宁</text><text x="514" y="294" fill="#354256" font-size="18">1936年红军三大主力会师标志长征胜利结束。</text><text x="36" y="364" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>