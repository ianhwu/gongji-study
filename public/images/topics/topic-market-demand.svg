<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">供求、市场结构与价格干预知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">供求、市场结构与价格干预</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">微观分析</text><text x="58" y="180" fill="#354256" font-size="18">关注个体、企业和具体市场的选择与资源配置，宏观</text><text x="58" y="208" fill="#354256" font-size="18">分析则关注经济总体。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">需求与供给</text><text x="514" y="180" fill="#354256" font-size="18">区分商品自身价格引起的数量变化，与收入、成本等</text><text x="514" y="208" fill="#354256" font-size="18">引起的曲线移动。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">替代与互补</text><text x="58" y="322" fill="#354256" font-size="18">替代品满足类似需求；互补品一起使用，相关价格变</text><text x="58" y="350" fill="#354256" font-size="18">化影响需求。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">四种结构</text><text x="514" y="322" fill="#354256" font-size="18">完全竞争、垄断竞争、寡头垄断、完全垄断，按厂商</text><text x="514" y="350" fill="#354256" font-size="18">数量、产品差异、进入壁垒等区分。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">最高限价</text><text x="58" y="464" fill="#354256" font-size="18">只有低于均衡价并具有约束力时，才会产生相应短缺</text><text x="58" y="492" fill="#354256" font-size="18">压力。</text><rect x="492" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="432" fill="#24599b" font-size="20" font-weight="700">最低限价</text><text x="514" y="464" fill="#354256" font-size="18">只有高于均衡价并具有约束力时，才会产生相应过剩</text><text x="514" y="492" fill="#354256" font-size="18">压力。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>