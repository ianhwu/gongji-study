<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">抗日战争 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">抗日战争 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">九一八</text><text x="58" y="180" fill="#354256" font-size="18">九一八事变发生于1931年，是中国人民局部抗战的</text><text x="58" y="208" fill="#354256" font-size="18">起点。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">七七</text><text x="514" y="180" fill="#354256" font-size="18">七七事变又称卢沟桥事变，发生于1937年。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">百团大战</text><text x="58" y="322" fill="#354256" font-size="18">1940年百团大战在敌后战场展开，主要攻击日军交</text><text x="58" y="350" fill="#354256" font-size="18">通线和据点。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">9.3</text><text x="514" y="322" fill="#354256" font-size="18">中国人民抗日战争胜利纪念日为9月3日。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>