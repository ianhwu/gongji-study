<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title"><title id="title">文化建设：核心价值体系与核心价值观知识框架</title><rect width="960" height="556" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">文化建设：核心价值体系与核心价值观</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">核心价值体系</text><text x="58" y="180" fill="#354256" font-size="18">马克思主义指导思想、中国特色社会主义共同理想、</text><text x="58" y="208" fill="#354256" font-size="18">民族精神和时代精神、社会主义荣辱观。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">国家层面</text><text x="514" y="180" fill="#354256" font-size="18">富强、民主、文明、和谐。</text><rect x="36" y="258" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">社会层面</text><text x="58" y="322" fill="#354256" font-size="18">自由、平等、公正、法治。</text><rect x="492" y="258" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">个人层面</text><text x="514" y="322" fill="#354256" font-size="18">爱国、敬业、诚信、友善。</text><rect x="36" y="372" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="404" fill="#24599b" font-size="20" font-weight="700">精神联系</text><text x="58" y="436" fill="#354256" font-size="18">民族精神以爱国主义为核心，时代精神以改革创新为</text><text x="58" y="464" fill="#354256" font-size="18">核心。</text><text x="36" y="534" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>