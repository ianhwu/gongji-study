<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">经济学定律 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">经济学定律 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">逆向选择</text><text x="58" y="180" fill="#354256" font-size="18">信息不对称导致的逆向选择通常表现为交易达成前的</text><text x="58" y="208" fill="#354256" font-size="18">筛选问题。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">丰收悖论</text><text x="514" y="180" fill="#354256" font-size="18">在需求缺乏价格弹性等条件下，丰收引起价格下跌可</text><text x="514" y="208" fill="#354256" font-size="18">能使农民总收入降低。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">棘轮效应</text><text x="58" y="322" fill="#354256" font-size="18">消费习惯向上调整容易、向下调整困难可用棘轮效应</text><text x="58" y="350" fill="#354256" font-size="18">解释。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">公地悲剧</text><text x="514" y="322" fill="#354256" font-size="18">公地悲剧强调公共资源在缺乏有效约束时可能被过度</text><text x="514" y="350" fill="#354256" font-size="18">使用。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>