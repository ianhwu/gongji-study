<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title"><title id="title">毛泽东思想与党史知识框架知识框架</title><rect width="960" height="500" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">毛泽东思想与党史知识框架</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">中共一大</text><text x="58" y="180" fill="#354256" font-size="18">1921年；宣告中国共产党成立</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">中共二大</text><text x="514" y="180" fill="#354256" font-size="18">1922年；提出反帝反封建的民主革命纲领</text><rect x="36" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">中共三大</text><text x="58" y="294" fill="#354256" font-size="18">1923年；党内合作方针</text><rect x="492" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">中共四大</text><text x="514" y="294" fill="#354256" font-size="18">1925年；领导权和工农联盟</text><rect x="36" y="344" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="376" fill="#24599b" font-size="20" font-weight="700">中共七大</text><text x="58" y="408" fill="#354256" font-size="18">1945年；毛泽东思想确立为指导思想</text><text x="36" y="478" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>