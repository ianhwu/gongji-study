<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">收入分配、发展指标与汇率知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">收入分配、发展指标与汇率</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">初次与再分配</text><text x="58" y="180" fill="#354256" font-size="18">初次分配联系生产与要素参与；再分配联系税收、转</text><text x="58" y="208" fill="#354256" font-size="18">移支付和公共保障等机制。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">基尼系数</text><text x="514" y="180" fill="#354256" font-size="18">反映收入分配差距；与总体收入水平不是同一个指标</text><text x="514" y="208" fill="#354256" font-size="18">。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">恩格尔系数</text><text x="58" y="322" fill="#354256" font-size="18">食品支出占消费支出的比重，分析时注意消费口径与</text><text x="58" y="350" fill="#354256" font-size="18">条件。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">直接标价</text><text x="514" y="322" fill="#354256" font-size="18">用本币表示一定单位外币的价格；数字变化须先固定</text><text x="514" y="350" fill="#354256" font-size="18">标价单位。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">实体经济</text><text x="58" y="464" fill="#354256" font-size="18">联系物质产品与服务生产，为经济发展提供基础支撑</text><text x="58" y="492" fill="#354256" font-size="18">。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>