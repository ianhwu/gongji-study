<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">世界地理：海陆、水道与交通知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">世界地理：海陆、水道与交通</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">海峡与运河</text><text x="58" y="180" fill="#354256" font-size="18">海峡通常是自然形成的狭窄水道；运河是人工开凿的</text><text x="58" y="208" fill="#354256" font-size="18">水道。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">连接关系</text><text x="514" y="180" fill="#354256" font-size="18">每个水道至少写清两端海域，并在世界地图上定位。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">大洲分界</text><text x="58" y="322" fill="#354256" font-size="18">某些海峡、山脉、河流等构成地理分界，需逐项核对</text><text x="58" y="350" fill="#354256" font-size="18">。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">航运路线</text><text x="514" y="322" fill="#354256" font-size="18">从起点、终点和海域顺序推断需经过的水道，注意可</text><text x="514" y="350" fill="#354256" font-size="18">选路线。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>