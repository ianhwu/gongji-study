<svg xmlns="http://www.w3.org/2000/svg" width="960" height="612" viewBox="0 0 960 612" role="img" aria-labelledby="title"><title id="title">现代中国科技：人物、计划与航天任务知识框架</title><rect width="960" height="612" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">现代中国科技：人物、计划与航天任务</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">科学家</text><text x="58" y="180" fill="#354256" font-size="18">三钱为钱学森、钱伟长、钱三强，分别联系航天、力</text><text x="58" y="208" fill="#354256" font-size="18">学、核科学等贡献。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">科研与产业</text><text x="514" y="180" fill="#354256" font-size="18">攀登计划重基础研究；火炬计划重高新技术成果产业</text><text x="514" y="208" fill="#354256" font-size="18">化，研究与商业转化不能互换。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">载人航天</text><text x="58" y="322" fill="#354256" font-size="18">神舟五号于2003年载杨利伟完成首次载人飞行；载</text><text x="58" y="350" fill="#354256" font-size="18">人飞行不等于载人登月。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">科学卫星</text><text x="514" y="322" fill="#354256" font-size="18">墨子号量子实验、悟空号暗物质探测、张衡一号电磁</text><text x="514" y="350" fill="#354256" font-size="18">监测；按任务分类。</text><rect x="36" y="400" width="432" height="148" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">导航与发射</text><text x="58" y="464" fill="#354256" font-size="18">北斗、GPS、格洛纳斯、伽利略对应中国、美国、俄</text><text x="58" y="492" fill="#354256" font-size="18">罗斯、欧盟；酒泉、太原、西昌、文昌是传统四大发</text><text x="58" y="520" fill="#354256" font-size="18">射场。</text><text x="36" y="590" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>