<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">民事法律行为的效力与意思表示知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">民事法律行为的效力与意思表示</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">生效条件</text><text x="58" y="180" fill="#354256" font-size="18">结合相应民事行为能力、真实意思表示、法律和公序</text><text x="58" y="208" fill="#354256" font-size="18">良俗要求判断。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">无效</text><text x="514" y="180" fill="#354256" font-size="18">违反法定效力要求，具体情形须适用法律；不能与一</text><text x="514" y="208" fill="#354256" font-size="18">般违约等同。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">可撤销</text><text x="58" y="322" fill="#354256" font-size="18">重大误解、欺诈、胁迫、显失公平等依法产生撤销权</text><text x="58" y="350" fill="#354256" font-size="18">，关注主体和行使期限。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">追认问题</text><text x="514" y="322" fill="#354256" font-size="18">限制行为能力等情形需结合行为内容、法定代理人的</text><text x="514" y="350" fill="#354256" font-size="18">同意或追认分析。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>