<svg xmlns="http://www.w3.org/2000/svg" width="960" height="728" viewBox="0 0 960 728" role="img" aria-labelledby="title"><title id="title">世界史：文明、制度与战争的时间联系知识框架</title><rect width="960" height="728" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">世界史：文明、制度与战争的时间联系</text><text x="36" y="86" fill="#576579" font-size="17">按时间排列；各节点的背景与影响需分别理解。</text><rect x="36" y="116" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">古代文明</text><text x="58" y="180" fill="#354256" font-size="18">古巴比伦的汉谟拉比法典体现早期成文法；古希腊史诗与古罗马法律另作区别。</text><rect x="36" y="230" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">制度变迁</text><text x="58" y="294" fill="#354256" font-size="18">英国1689年权利法案联系限制王权；法国1792年第一共和国联系废除君主制。</text><rect x="36" y="344" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="376" fill="#24599b" font-size="20" font-weight="700">美国南北战争</text><text x="58" y="408" fill="#354256" font-size="18">1861—1865年，围绕联邦统一与奴隶制度等矛盾展开，区别于美国独立战争。</text><rect x="36" y="458" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="490" fill="#24599b" font-size="20" font-weight="700">二战转折</text><text x="58" y="522" fill="#354256" font-size="18">斯大林格勒战役主要发生于1942—1943年，是苏德战争重要转折。</text><rect x="36" y="572" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="604" fill="#24599b" font-size="20" font-weight="700">战后格局</text><text x="58" y="636" fill="#354256" font-size="18">1949年北约成立、1955年华约成立联系两极对峙；冷战不等于双方持续全面直接交战。</text><text x="36" y="706" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>