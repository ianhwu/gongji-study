<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">俄罗斯 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">俄罗斯 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">莫斯科</text><text x="58" y="180" fill="#354256" font-size="18">俄罗斯的首都是莫斯科</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">二月革命</text><text x="514" y="180" fill="#354256" font-size="18">俄国二月革命推翻罗曼诺夫王朝，十月革命推翻资产</text><text x="514" y="208" fill="#354256" font-size="18">阶级临时政府。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">高尔基</text><text x="58" y="322" fill="#354256" font-size="18">《童年》《在人间》《我的大学》是高尔基自传体三</text><text x="58" y="350" fill="#354256" font-size="18">部曲。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">伏尔加</text><text x="514" y="322" fill="#354256" font-size="18">伏尔加河注入里海，属于内流河</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>