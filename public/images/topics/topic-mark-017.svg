<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">公益诉讼 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">公益诉讼 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">社会公共利益</text><text x="58" y="180" fill="#354256" font-size="18">公益诉讼针对的是损害社会公共利益的行为。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">五年以上</text><text x="514" y="180" fill="#354256" font-size="18">提起环境公益诉讼的社会组织须专门从事环境保护公</text><text x="514" y="208" fill="#354256" font-size="18">益活动连续五年以上且无违法记录。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">消费者协会</text><text x="58" y="322" fill="#354256" font-size="18">中国消费者协会以及省级消费者协会可依法提起消费</text><text x="58" y="350" fill="#354256" font-size="18">公益诉讼。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">近亲属</text><text x="514" y="322" fill="#354256" font-size="18">英雄烈士没有近亲属或者近亲属不提起诉讼时，检察</text><text x="514" y="350" fill="#354256" font-size="18">机关可依法对损害公共利益的侵害行为提起诉讼。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>