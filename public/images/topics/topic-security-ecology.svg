<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title"><title id="title">国家安全、生态文明与国防统一知识框架</title><rect width="960" height="556" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">国家安全、生态文明与国防统一</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">总体国家安全观</text><text x="58" y="180" fill="#354256" font-size="18">以人民安全为宗旨、政治安全为根本，结合各领域安</text><text x="58" y="208" fill="#354256" font-size="18">全整体理解。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">发展与安全</text><text x="514" y="180" fill="#354256" font-size="18">发展提供物质基础，安全提供稳定条件，要统筹处理</text><text x="514" y="208" fill="#354256" font-size="18">。</text><rect x="36" y="258" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">生态文明</text><text x="58" y="322" fill="#354256" font-size="18">从保护、修复、资源节约与发展方式转变共同理解。</text><rect x="492" y="258" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">国防与军队</text><text x="514" y="322" fill="#354256" font-size="18">联系维护国家主权、安全、发展利益和强军目标。</text><rect x="36" y="372" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="404" fill="#24599b" font-size="20" font-weight="700">一国两制</text><text x="58" y="436" fill="#354256" font-size="18">“一国”是实行“两制”的前提和基础，相关表述须</text><text x="58" y="464" fill="#354256" font-size="18">结合具体制度规定。</text><text x="36" y="534" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>