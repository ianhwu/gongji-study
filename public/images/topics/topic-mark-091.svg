<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title"><title id="title">历史唯物主义 · 马克资料专题知识框架</title><rect width="960" height="414" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">历史唯物主义 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">社会存在</text><text x="58" y="180" fill="#354256" font-size="18">社会存在决定社会意识，社会意识具有相对独立性。</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">生产力</text><text x="514" y="180" fill="#354256" font-size="18">生产力决定生产关系，生产关系对生产力有反作用。</text><rect x="36" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">经济基础</text><text x="58" y="294" fill="#354256" font-size="18">经济基础决定上层建筑，上层建筑对经济基础有反作</text><text x="58" y="322" fill="#354256" font-size="18">用。</text><rect x="492" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">人民群众</text><text x="514" y="294" fill="#354256" font-size="18">人民群众是历史的创造者，是社会物质财富和精神财</text><text x="514" y="322" fill="#354256" font-size="18">富的创造者。</text><text x="36" y="392" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>