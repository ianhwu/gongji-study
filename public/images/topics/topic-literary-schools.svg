<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">文学流派、外国文学与作品配对知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">文学流派、外国文学与作品配对</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">中国现当代</text><text x="58" y="180" fill="#354256" font-size="18">鲁迅、郭沫若、曹禺、茅盾、孙犁等，各自代表作品</text><text x="58" y="208" fill="#354256" font-size="18">与体裁分开。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">文学流派</text><text x="514" y="180" fill="#354256" font-size="18">荷花淀派、山药蛋派等与代表作家、地域和风格联系</text><text x="514" y="208" fill="#354256" font-size="18">。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">外国文学</text><text x="58" y="322" fill="#354256" font-size="18">按国家与文学时代定位，再核对作者—作品对应。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">奖项与文体</text><text x="514" y="322" fill="#354256" font-size="18">文学奖设立、长篇小说、戏剧、童话不是同一分类维</text><text x="514" y="350" fill="#354256" font-size="18">度。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>