<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">电路、化学电池与信息技术知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">电路、化学电池与信息技术</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">电路与测量</text><text x="58" y="180" fill="#354256" font-size="18">区分电流、电压、电阻；电流表、电压表连接方式不</text><text x="58" y="208" fill="#354256" font-size="18">同，实验图需看量程和接线。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">电池与光伏</text><text x="514" y="180" fill="#354256" font-size="18">电池把化学能等转为电能；光伏依靠相应半导体效应</text><text x="514" y="208" fill="#354256" font-size="18">转换太阳辐射能。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">硬件与软件</text><text x="58" y="322" fill="#354256" font-size="18">硬件承担物理运行；系统软件管理运行环境，应用软</text><text x="58" y="350" fill="#354256" font-size="18">件服务具体任务。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">字长与性能</text><text x="514" y="322" fill="#354256" font-size="18">字长是相关数据处理能力的指标之一，不能独自决定</text><text x="514" y="350" fill="#354256" font-size="18">全部性能。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">安全与云</text><text x="58" y="464" fill="#354256" font-size="18">病毒具有程序与传播等特征；云服务联系网络、资源</text><text x="58" y="492" fill="#354256" font-size="18">配置和服务方式。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>