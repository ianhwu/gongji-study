<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title"><title id="title">国家机关与立法权限知识框架</title><rect width="960" height="556" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">国家机关与立法权限</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">全国人大</text><text x="58" y="180" fill="#354256" font-size="18">最高国家权力机关；修改宪法，制定和修改基本法律</text><text x="58" y="208" fill="#354256" font-size="18">等。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">全国人大常委会</text><text x="514" y="180" fill="#354256" font-size="18">全国人大的常设机关；解释宪法，依法制定和修改其</text><text x="514" y="208" fill="#354256" font-size="18">他法律等。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">国家主席</text><text x="58" y="322" fill="#354256" font-size="18">依全国人大及其常委会的决定公布法律等，公布与制</text><text x="58" y="350" fill="#354256" font-size="18">定须区分。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">国务院</text><text x="514" y="322" fill="#354256" font-size="18">最高国家行政机关，依法制定行政法规。</text><rect x="36" y="400" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">法院、检察院、监察机关</text><text x="58" y="464" fill="#354256" font-size="18">分别围绕审判、法律监督、国家监察履行法定职责。</text><text x="36" y="534" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>