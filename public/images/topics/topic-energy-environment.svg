<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">能源、环境与可持续发展知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">能源、环境与可持续发展</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">可再生能源</text><text x="58" y="180" fill="#354256" font-size="18">太阳能、风能、水能、地热等，资源分布与利用条件</text><text x="58" y="208" fill="#354256" font-size="18">不同。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">核能与化学能</text><text x="514" y="180" fill="#354256" font-size="18">核裂变、核聚变与化学燃烧的能量机制不同。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">生物质与氢能</text><text x="58" y="322" fill="#354256" font-size="18">生物质源于有机物，氢通常作二次能源载体，需要制</text><text x="58" y="350" fill="#354256" font-size="18">取。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">环境治理</text><text x="514" y="322" fill="#354256" font-size="18">废弃物、富营养化、低碳与国际气候合作按具体机制</text><text x="514" y="350" fill="#354256" font-size="18">理解。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>