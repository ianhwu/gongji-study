<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">新时代思想：方法论与战略部署知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">新时代思想：方法论与战略部署</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">理论定位</text><text x="58" y="180" fill="#354256" font-size="18">习近平新时代中国特色社会主义思想是当代中国马克</text><text x="58" y="208" fill="#354256" font-size="18">思主义、二十一世纪马克思主义。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">主要内容</text><text x="514" y="180" fill="#354256" font-size="18">十个明确、十四个坚持、十三个方面成就等从不同角</text><text x="514" y="208" fill="#354256" font-size="18">度概括，不能交换名称与功能。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">世界观方法论</text><text x="58" y="322" fill="#354256" font-size="18">六个必须坚持：人民至上、自信自立、守正创新、问</text><text x="58" y="350" fill="#354256" font-size="18">题导向、系统观念、胸怀天下。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">领域部署</text><text x="514" y="322" fill="#354256" font-size="18">经济、政治、文化、社会、生态等任务分别解释具体</text><text x="514" y="350" fill="#354256" font-size="18">问题，不能以一个领域替代完整体系。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>