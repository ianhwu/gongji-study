<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">法院、检察院与监察机关关系知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">法院、检察院与监察机关关系</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">人民法院</text><text x="58" y="180" fill="#354256" font-size="18">国家审判机关，依法行使审判权；上下级法院之间是</text><text x="58" y="208" fill="#354256" font-size="18">审判工作监督关系。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">人民检察院</text><text x="514" y="180" fill="#354256" font-size="18">国家法律监督机关；上下级检察院之间是领导关系。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">最高人民检察院</text><text x="58" y="322" fill="#354256" font-size="18">最高检察机关，对全国人大及其常委会负责，领导地</text><text x="58" y="350" fill="#354256" font-size="18">方各级和专门检察院工作。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">监察机关</text><text x="514" y="322" fill="#354256" font-size="18">国家监察机关，依法律履行监察职责，不能替代法院</text><text x="514" y="350" fill="#354256" font-size="18">作出刑事裁判。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>