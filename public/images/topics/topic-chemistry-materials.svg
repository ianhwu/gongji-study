<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">化学常识：元素、材料与生活知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">化学常识：元素、材料与生活</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">元素与物质</text><text x="58" y="180" fill="#354256" font-size="18">元素按原子种类理解；单质由一种元素组成，化合物</text><text x="58" y="208" fill="#354256" font-size="18">由不同元素组成，混合物另作分类。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">合金</text><text x="514" y="180" fill="#354256" font-size="18">由金属与其他元素形成的材料体系，性质可能不同于</text><text x="514" y="208" fill="#354256" font-size="18">组分金属。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">肥料与营养</text><text x="58" y="322" fill="#354256" font-size="18">氮、磷、钾等关注植物需要和肥料组成，不能把全部</text><text x="58" y="350" fill="#354256" font-size="18">氮元素形态视为同一种肥效。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">生活化合物</text><text x="514" y="322" fill="#354256" font-size="18">食盐主要成分为氯化钠；二氧化硫等需结合性质、用</text><text x="514" y="350" fill="#354256" font-size="18">途与环境影响。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">可燃冰</text><text x="58" y="464" fill="#354256" font-size="18">通常联系天然气水合物，外观像冰但组成与普通冰不</text><text x="58" y="492" fill="#354256" font-size="18">同。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>