<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">民法原则与调整对象知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">民法原则与调整对象</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">平等、自愿</text><text x="58" y="180" fill="#354256" font-size="18">法律地位平等；在法律允许范围内自主决定民事活动</text><text x="58" y="208" fill="#354256" font-size="18">。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">公平、诚信</text><text x="514" y="180" fill="#354256" font-size="18">合理确定各方权利义务；诚实守信，善意履行责任。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">守法与公序良俗</text><text x="58" y="322" fill="#354256" font-size="18">民事活动不得违反法律，也不得违背公共秩序与善良</text><text x="58" y="350" fill="#354256" font-size="18">风俗。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">绿色原则</text><text x="514" y="322" fill="#354256" font-size="18">有利于节约资源、保护生态环境。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">七编结构</text><text x="58" y="464" fill="#354256" font-size="18">总则、物权、合同、人格权、婚姻家庭、继承、侵权</text><text x="58" y="492" fill="#354256" font-size="18">责任；2021年1月1日起施行。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>