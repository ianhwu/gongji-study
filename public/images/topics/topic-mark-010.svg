<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">德国 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">德国 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">歌德</text><text x="58" y="180" fill="#354256" font-size="18">《浮士德》和《少年维特之烦恼》是德国作家歌德的</text><text x="58" y="208" fill="#354256" font-size="18">作品。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">伦琴</text><text x="514" y="180" fill="#354256" font-size="18">伦琴发现X射线，并获首届诺贝尔物理学奖。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">开普勒</text><text x="58" y="322" fill="#354256" font-size="18">开普勒第一定律指出行星沿椭圆轨道运行，太阳在一</text><text x="58" y="350" fill="#354256" font-size="18">个焦点上。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">贝多芬</text><text x="514" y="322" fill="#354256" font-size="18">贝多芬是德国作曲家，《第九交响曲》包含《欢乐颂</text><text x="514" y="350" fill="#354256" font-size="18">》合唱</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>