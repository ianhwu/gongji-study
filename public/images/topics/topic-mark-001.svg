<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">爱眼 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">爱眼 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">瞳孔</text><text x="58" y="180" fill="#354256" font-size="18">光线变弱时，瞳孔通常扩大，以增加进入眼内的光量</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">晶状体</text><text x="514" y="180" fill="#354256" font-size="18">正常眼看近处物体时，晶状体曲度增大，折光能力增</text><text x="514" y="208" fill="#354256" font-size="18">强</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">近视</text><text x="58" y="322" fill="#354256" font-size="18">近视眼看远处物体时，像形成在视网膜之前，通常用</text><text x="58" y="350" fill="#354256" font-size="18">凹透镜矫正</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">虹膜</text><text x="514" y="322" fill="#354256" font-size="18">虹膜中央的孔是瞳孔，巩膜构成眼球外壁的主要部分</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>