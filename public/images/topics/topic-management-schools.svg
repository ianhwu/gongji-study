<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">管理学派、激励与认知效应知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">管理学派、激励与认知效应</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">古典管理</text><text x="58" y="180" fill="#354256" font-size="18">泰勒联系科学管理，法约尔联系一般管理，韦伯联系</text><text x="58" y="208" fill="#354256" font-size="18">理想行政组织体系。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">人际关系</text><text x="514" y="180" fill="#354256" font-size="18">梅奥等关注人的社会需要、非正式组织及群体影响。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">需要层次</text><text x="58" y="322" fill="#354256" font-size="18">马斯洛从生理、安全、归属与爱、尊重到自我实现理</text><text x="58" y="350" fill="#354256" font-size="18">解需要。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">首因与近因</text><text x="514" y="322" fill="#354256" font-size="18">分别强调最初与最近信息的影响；晕轮是某突出印象</text><text x="514" y="350" fill="#354256" font-size="18">扩展到其他评价。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">木桶、破窗等效应</text><text x="58" y="464" fill="#354256" font-size="18">用来分析短板、环境信号、竞争或惯性等现象，要核</text><text x="58" y="492" fill="#354256" font-size="18">对情境而非机械套用。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>