<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">文物、传统技术与视觉识别知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">文物、传统技术与视觉识别</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">青铜器</text><text x="58" y="180" fill="#354256" font-size="18">鼎、尊、编钟等用途不同；铭文、纹饰与器形共同提</text><text x="58" y="208" fill="#354256" font-size="18">供识别线索。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">陶与瓷</text><text x="514" y="180" fill="#354256" font-size="18">原料、烧成温度和工艺存在区别，不宜只凭颜色判断</text><text x="514" y="208" fill="#354256" font-size="18">。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">工程与技术</text><text x="58" y="322" fill="#354256" font-size="18">都江堰、赵州桥等联系结构、功能与历史背景；技术</text><text x="58" y="350" fill="#354256" font-size="18">成果看解决的问题。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">造纸与印刷</text><text x="514" y="322" fill="#354256" font-size="18">区分书写材料改进与复制技术；活字印刷不是所有印</text><text x="514" y="350" fill="#354256" font-size="18">刷的起点。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>