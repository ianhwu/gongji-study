<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">专利法修改 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">专利法修改 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">二十年</text><text x="58" y="180" fill="#354256" font-size="18">发明专利权期限为二十年，实用新型为十年，均自申</text><text x="58" y="208" fill="#354256" font-size="18">请日起计算。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">十五年</text><text x="514" y="180" fill="#354256" font-size="18">2021年6月1日起申请的外观设计专利权期限为十五</text><text x="514" y="208" fill="#354256" font-size="18">年，自申请日起计算。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">整体或者局部</text><text x="58" y="322" fill="#354256" font-size="18">现行专利法的外观设计可以保护产品整体或者局部的</text><text x="58" y="350" fill="#354256" font-size="18">新设计。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">新颖性、创造性和实用性</text><text x="514" y="322" fill="#354256" font-size="18">发明和实用新型取得专利权应具备新颖性、创造性和</text><text x="514" y="350" fill="#354256" font-size="18">实用性。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>