<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">纪委与监察委 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">纪委与监察委 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">党的机构</text><text x="58" y="180" fill="#354256" font-size="18">纪律检查委员会属于党的机构，监察委员会属于国家</text><text x="58" y="208" fill="#354256" font-size="18">监察机关。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">双重领导</text><text x="514" y="180" fill="#354256" font-size="18">党的地方各级纪委受同级党委和上级纪委双重领导。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">全国人大及其常委会</text><text x="58" y="322" fill="#354256" font-size="18">国家监察委员会对全国人民代表大会及其常务委员会</text><text x="58" y="350" fill="#354256" font-size="18">负责，并接受监督。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">公权力</text><text x="514" y="322" fill="#354256" font-size="18">监察机关依法监察行使公权力的公职人员。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>