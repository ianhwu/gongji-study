<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">货币需求与供给 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">货币需求与供给 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">交易动机</text><text x="58" y="180" fill="#354256" font-size="18">为日常购物和支付持有货币，属于交易动机。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">谨慎动机</text><text x="514" y="180" fill="#354256" font-size="18">为应对未来不确定支出保留货币，属于谨慎或预防动</text><text x="514" y="208" fill="#354256" font-size="18">机。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">M₀</text><text x="58" y="322" fill="#354256" font-size="18">M0通常指流通中的现金。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">M₁</text><text x="514" y="322" fill="#354256" font-size="18">我国自2025年1月数据起修订的M1包括M0、单位活期</text><text x="514" y="350" fill="#354256" font-size="18">存款、个人活期存款及非银行支付机构客户备付金。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>