<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">先秦两汉文学与史书体例知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">先秦两汉文学与史书体例</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">诗经六义</text><text x="58" y="180" fill="#354256" font-size="18">风、雅、颂主要是内容和音乐分类；赋、比、兴主要</text><text x="58" y="208" fill="#354256" font-size="18">是表现手法。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">楚辞</text><text x="514" y="180" fill="#354256" font-size="18">联系屈原、楚地文化与相应文体特征，不等同于全部</text><text x="514" y="208" fill="#354256" font-size="18">先秦诗歌。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">纪传体</text><text x="58" y="322" fill="#354256" font-size="18">以人物传记等组织史事，《史记》是代表。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">编年与国别</text><text x="514" y="322" fill="#354256" font-size="18">分别按时间和国家组织材料，《左传》《战国策》等</text><text x="514" y="350" fill="#354256" font-size="18">须逐部核对。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">语录、通史、断代</text><text x="58" y="464" fill="#354256" font-size="18">语录看记言方式；通史与断代看时间范围，属于不同</text><text x="58" y="492" fill="#354256" font-size="18">分类轴。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>