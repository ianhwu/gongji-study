<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">吉林气候、水系、农业与生态知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">吉林气候、水系、农业与生态</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">气候与农业</text><text x="58" y="180" fill="#354256" font-size="18">温带季风气候等特征联系热量、水分和作物生长，具</text><text x="58" y="208" fill="#354256" font-size="18">体区域仍有差异。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">水系</text><text x="514" y="180" fill="#354256" font-size="18">松花江、图们江、鸭绿江等分别定位源地、流向与边</text><text x="514" y="208" fill="#354256" font-size="18">境属性。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">黑土地与粮食</text><text x="58" y="322" fill="#354256" font-size="18">关注土壤肥力、粮食生产与保护，黑土地不是只看土</text><text x="58" y="350" fill="#354256" font-size="18">壤颜色。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">长白山与湿地</text><text x="514" y="322" fill="#354256" font-size="18">分别联系森林、山地和湿地生态系统，以及保护与合</text><text x="514" y="350" fill="#354256" font-size="18">理利用。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>