<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">公文文种 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">公文文种 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">请示</text><text x="58" y="180" fill="#354256" font-size="18">请示适用于向上级机关请求指示、批准，应一文一事</text><text x="58" y="208" fill="#354256" font-size="18">。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">函</text><text x="514" y="180" fill="#354256" font-size="18">函适用于不相隶属机关之间商洽工作、询问答复问题</text><text x="514" y="208" fill="#354256" font-size="18">、请求批准和答复审批事项。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">通告</text><text x="58" y="322" fill="#354256" font-size="18">通告适用于在一定范围内公布应当遵守或者周知的事</text><text x="58" y="350" fill="#354256" font-size="18">项。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">公告</text><text x="514" y="322" fill="#354256" font-size="18">公告适用于向国内外宣布重要事项或者法定事项。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>