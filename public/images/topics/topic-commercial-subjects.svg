<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">法人、公司与票据知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">法人、公司与票据</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">法人</text><text x="58" y="180" fill="#354256" font-size="18">依法独立享有民事权利、承担民事义务的组织。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">公司与股东</text><text x="514" y="180" fill="#354256" font-size="18">公司以全部财产承担债务；股东责任须按公司类型与</text><text x="514" y="208" fill="#354256" font-size="18">法定条件判断。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">分公司与子公司</text><text x="58" y="322" fill="#354256" font-size="18">分公司无独立法人资格，子公司一般具有独立法人资</text><text x="58" y="350" fill="#354256" font-size="18">格。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">票据</text><text x="514" y="322" fill="#354256" font-size="18">依法载明支付一定金额的凭证，出票、付款、背书等</text><text x="514" y="350" fill="#354256" font-size="18">角色需分开。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>