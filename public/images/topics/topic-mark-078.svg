<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">土地政策 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">土地政策 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">井冈山土地法</text><text x="58" y="180" fill="#354256" font-size="18">1928年《井冈山土地法》规定没收一切土地。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">兴国土地法</text><text x="514" y="180" fill="#354256" font-size="18">1929年《兴国土地法》把没收对象改为地主阶级土</text><text x="514" y="208" fill="#354256" font-size="18">地。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">减租减息</text><text x="58" y="322" fill="#354256" font-size="18">抗日战争时期土地政策以减租减息等为主要内容。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">农民的土地所有制</text><text x="514" y="322" fill="#354256" font-size="18">1950年土地改革法指向废除封建地主土地所有制、</text><text x="514" y="350" fill="#354256" font-size="18">实行农民土地所有制。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>