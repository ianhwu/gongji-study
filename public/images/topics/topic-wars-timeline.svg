<svg xmlns="http://www.w3.org/2000/svg" width="960" height="842" viewBox="0 0 960 842" role="img" aria-labelledby="title"><title id="title">抗战、解放战争与抗美援朝时间线知识框架</title><rect width="960" height="842" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">抗战、解放战争与抗美援朝时间线</text><text x="36" y="86" fill="#576579" font-size="17">按时间排列；各节点的背景与影响需分别理解。</text><rect x="36" y="116" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">1935年长征阶段</text><text x="58" y="180" fill="#354256" font-size="18">娄山关战斗联系红军长征与遵义会议后的军事行动，不能当作抗日会战。</text><rect x="36" y="230" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">1937年全面抗战初期</text><text x="58" y="294" fill="#354256" font-size="18">淞沪会战体现持续抵抗；平型关大捷联系八路军出师抗战。</text><rect x="36" y="344" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="376" fill="#24599b" font-size="20" font-weight="700">1940年百团大战</text><text x="58" y="408" fill="#354256" font-size="18">华北战场，八路军开展交通线和据点破袭；区别于缅甸远征。</text><rect x="36" y="458" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="490" fill="#24599b" font-size="20" font-weight="700">1941—1942年</text><text x="58" y="522" fill="#354256" font-size="18">第三次长沙会战在国内战场；1942年仁安羌战役在缅甸，中国远征军参战。</text><rect x="36" y="572" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="604" fill="#24599b" font-size="20" font-weight="700">1948—1949年淮海战役</text><text x="58" y="636" fill="#354256" font-size="18">解放战争时期，华东与中原野战军等共同实施。</text><rect x="36" y="686" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="718" fill="#24599b" font-size="20" font-weight="700">1950—1951年抗美援朝</text><text x="58" y="750" fill="#354256" font-size="18">长津湖联系第二次战役；铁原阻击联系第五次战役与第63军。</text><text x="36" y="820" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>