<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">新民主主义革命理论 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">新民主主义革命理论 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">领导</text><text x="58" y="180" fill="#354256" font-size="18">新民主主义革命由无产阶级领导。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">帝国主义</text><text x="514" y="180" fill="#354256" font-size="18">新民主主义革命的主要对象包括帝国主义、封建主义</text><text x="514" y="208" fill="#354256" font-size="18">、官僚资本主义。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">联合</text><text x="58" y="322" fill="#354256" font-size="18">新民主主义共和国的国体是各革命阶级的联合专政。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">工农武装割据</text><text x="514" y="322" fill="#354256" font-size="18">农村包围城市、武装夺取政权是中国革命道路的重要</text><text x="514" y="350" fill="#354256" font-size="18">概括。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>