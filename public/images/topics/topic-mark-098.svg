<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">微观经济：市场与供需 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">微观经济：市场与供需 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">需求</text><text x="58" y="180" fill="#354256" font-size="18">其他条件不变时，普通商品价格上升通常使其需求量</text><text x="58" y="208" fill="#354256" font-size="18">下降。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">供给</text><text x="514" y="180" fill="#354256" font-size="18">其他条件不变时，商品价格上升通常使其供给量增加</text><text x="514" y="208" fill="#354256" font-size="18">。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">完全竞争</text><text x="58" y="322" fill="#354256" font-size="18">完全竞争市场中单个厂商通常是价格接受者。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">机会成本</text><text x="514" y="322" fill="#354256" font-size="18">机会成本指选择一项方案时放弃的其他方案中价值最</text><text x="514" y="350" fill="#354256" font-size="18">大的收益。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>