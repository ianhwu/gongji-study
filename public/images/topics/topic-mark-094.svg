<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">邓小平理论与基本路线 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">邓小平理论与基本路线 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">一个中心</text><text x="58" y="180" fill="#354256" font-size="18">社会主义初级阶段基本路线中的一个中心是以经济建</text><text x="58" y="208" fill="#354256" font-size="18">设为中心。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">四项基本原则</text><text x="514" y="180" fill="#354256" font-size="18">四项基本原则是坚持社会主义道路、人民民主专政、</text><text x="514" y="208" fill="#354256" font-size="18">中国共产党领导、马克思列宁主义毛泽东思想。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">改革开放</text><text x="58" y="322" fill="#354256" font-size="18">改革开放是强国之路，四项基本原则是立国之本。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">本质</text><text x="514" y="322" fill="#354256" font-size="18">解放生产力、发展生产力，消灭剥削、消除两极分化</text><text x="514" y="350" fill="#354256" font-size="18">，最终达到共同富裕是社会主义本质的概括。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>