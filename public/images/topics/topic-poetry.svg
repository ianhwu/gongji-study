<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">诗歌与词：时代、作者、风格知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">诗歌与词：时代、作者、风格</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">魏晋南北朝</text><text x="58" y="180" fill="#354256" font-size="18">陶渊明与田园诗，汉乐府及相关长篇作品按时代区分</text><text x="58" y="208" fill="#354256" font-size="18">。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">初唐与盛唐</text><text x="514" y="180" fill="#354256" font-size="18">初唐四杰与李白、杜甫、王维等所处阶段、风格不同</text><text x="514" y="208" fill="#354256" font-size="18">。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">中晚唐</text><text x="58" y="322" fill="#354256" font-size="18">白居易、刘禹锡、李贺等结合代表作与艺术特征学习</text><text x="58" y="350" fill="#354256" font-size="18">。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">宋词</text><text x="514" y="322" fill="#354256" font-size="18">苏轼、辛弃疾、李清照等联系作品、词风和时代，不</text><text x="514" y="350" fill="#354256" font-size="18">将某种风格绝对化到所有作品。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">现代诗</text><text x="58" y="464" fill="#354256" font-size="18">联系现代作者与新诗发展，避免与古典诗词体裁混排</text><text x="58" y="492" fill="#354256" font-size="18">。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>