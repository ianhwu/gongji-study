<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">民事诉讼法修改 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">民事诉讼法修改 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">同等法律效力</text><text x="58" y="180" fill="#354256" font-size="18">经当事人同意，通过信息网络平台在线进行的民事诉</text><text x="58" y="208" fill="#354256" font-size="18">讼活动与线下活动具有同等法律效力。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">公告</text><text x="514" y="180" fill="#354256" font-size="18">国内一般民事诉讼公告送达自发出公告之日起经过三</text><text x="514" y="208" fill="#354256" font-size="18">十日视为送达。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">一审终审</text><text x="58" y="322" fill="#354256" font-size="18">依法适用小额诉讼程序审理的民事案件实行一审终审</text><text x="58" y="350" fill="#354256" font-size="18">。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">电子</text><text x="514" y="322" fill="#354256" font-size="18">经受送达人同意，可采用能确认收悉的电子方式送达</text><text x="514" y="350" fill="#354256" font-size="18">；其要求纸质判决书、裁定书、调解书时应提供。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>