<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">统一战线 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">统一战线 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">个人身份</text><text x="58" y="180" fill="#354256" font-size="18">第一次国共合作采取共产党员以个人身份加入国民党</text><text x="58" y="208" fill="#354256" font-size="18">的党内合作形式。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">三大法宝</text><text x="514" y="180" fill="#354256" font-size="18">统一战线、武装斗争、党的建设是中国革命的三大法</text><text x="514" y="208" fill="#354256" font-size="18">宝。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">有理、有利、有节</text><text x="58" y="322" fill="#354256" font-size="18">抗日民族统一战线中对顽固势力斗争坚持有理、有利</text><text x="58" y="350" fill="#354256" font-size="18">、有节。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">三三制</text><text x="514" y="322" fill="#354256" font-size="18">抗日根据地三三制政权中，共产党员、非党左派进步</text><text x="514" y="350" fill="#354256" font-size="18">分子、中间分子各占三分之一。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>