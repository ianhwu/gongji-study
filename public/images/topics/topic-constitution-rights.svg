<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">宪法制度、公民权利与义务知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">宪法制度、公民权利与义务</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">国家性质与政权组织</text><text x="58" y="180" fill="#354256" font-size="18">国体关注国家阶级性质；政体关注政权组织形式，二</text><text x="58" y="208" fill="#354256" font-size="18">者不能互换。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">国家结构</text><text x="514" y="180" fill="#354256" font-size="18">我国实行单一制；民族区域自治是国家统一领导下的</text><text x="514" y="208" fill="#354256" font-size="18">自治。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">公民与人民</text><text x="58" y="322" fill="#354256" font-size="18">公民是具有国籍的法律概念；人民是政治概念，使用</text><text x="58" y="350" fill="#354256" font-size="18">范围不同。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">选举权与被选举权</text><text x="514" y="322" fill="#354256" font-size="18">须结合国籍、年龄与政治权利状态判断，不以职业或</text><text x="514" y="350" fill="#354256" font-size="18">财产作为一般条件。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">权利与义务</text><text x="58" y="464" fill="#354256" font-size="18">同一事项可能兼有权利与义务属性；行使权利还要考</text><text x="58" y="492" fill="#354256" font-size="18">虑法定界限。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>