<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">法律规范、规则与法的分类知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">法律规范、规则与法的分类</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">法律特征</text><text x="58" y="180" fill="#354256" font-size="18">由国家制定或认可，规定权利义务，由国家强制力保</text><text x="58" y="208" fill="#354256" font-size="18">障实施。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">授权与义务</text><text x="514" y="180" fill="#354256" font-size="18">授权规则允许作出某行为；命令要求作为；禁止要求</text><text x="514" y="208" fill="#354256" font-size="18">不作为。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">确定、委任、准用</text><text x="58" y="322" fill="#354256" font-size="18">分别关注内容是否明确、是否交由其他机关规定、是</text><text x="58" y="350" fill="#354256" font-size="18">否援引其他规范。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">法律部门</text><text x="514" y="322" fill="#354256" font-size="18">主要按调整对象等划分部门，与法规的制定主体和名</text><text x="514" y="350" fill="#354256" font-size="18">称不是同一分类。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">实体与程序</text><text x="58" y="464" fill="#354256" font-size="18">实体规定权利义务本身；程序规定实现和处理这些权</text><text x="58" y="492" fill="#354256" font-size="18">利义务的步骤。</text><rect x="492" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="432" fill="#24599b" font-size="20" font-weight="700">一般与特别</text><text x="514" y="464" fill="#354256" font-size="18">适用范围不同；同一事项发生冲突时还需判断效力层</text><text x="514" y="492" fill="#354256" font-size="18">级与适用条件。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>