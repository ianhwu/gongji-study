<svg xmlns="http://www.w3.org/2000/svg" width="960" height="728" viewBox="0 0 960 728" role="img" aria-labelledby="title"><title id="title">党史会议与革命道路时间线知识框架</title><rect width="960" height="728" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">党史会议与革命道路时间线</text><text x="36" y="86" fill="#576579" font-size="17">按时间排列；各节点的背景与影响需分别理解。</text><rect x="36" y="116" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">1921—1922</text><text x="58" y="180" fill="#354256" font-size="18">一大标志中国共产党成立；二大提出党的最低纲领和最高纲领。</text><rect x="36" y="230" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">1923—1924</text><text x="58" y="294" fill="#354256" font-size="18">三大确立国共合作的有关方针，联系第一次国共合作的历史背景。</text><rect x="36" y="344" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="376" fill="#24599b" font-size="20" font-weight="700">1927</text><text x="58" y="408" fill="#354256" font-size="18">南昌起义、八七会议等节点要分别记事件性质与主要内容。</text><rect x="36" y="458" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="490" fill="#24599b" font-size="20" font-weight="700">1945</text><text x="58" y="522" fill="#354256" font-size="18">七大确立毛泽东思想为党的指导思想，联系抗战胜利前夕背景。</text><rect x="36" y="572" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="604" fill="#24599b" font-size="20" font-weight="700">1978</text><text x="58" y="636" fill="#354256" font-size="18">十一届三中全会开启改革开放和社会主义现代化建设新时期。</text><text x="36" y="706" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>