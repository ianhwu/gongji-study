<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">公务员与事业单位人事制度知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">公务员与事业单位人事制度</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">公务员考核</text><text x="58" y="180" fill="#354256" font-size="18">定期考核分优秀、称职、基本称职、不称职。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">公务员奖励</text><text x="514" y="180" fill="#354256" font-size="18">嘉奖、记三等功、记二等功、记一等功、授予称号等</text><text x="514" y="208" fill="#354256" font-size="18">。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">身份边界</text><text x="58" y="322" fill="#354256" font-size="18">公务员与事业单位工作人员适用制度不同，不能只看</text><text x="58" y="350" fill="#354256" font-size="18">工作单位是否公共机构。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">救济与期限</text><text x="514" y="322" fill="#354256" font-size="18">复核、申诉的提出机关、期限和决定期限需分开核对</text><text x="514" y="350" fill="#354256" font-size="18">。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>