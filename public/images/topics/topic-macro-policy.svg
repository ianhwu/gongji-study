<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">财政政策、货币政策与宏观指标知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">财政政策、货币政策与宏观指标</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">财政政策</text><text x="58" y="180" fill="#354256" font-size="18">政府税收、支出等工具；扩张通常联系增支或减税，</text><text x="58" y="208" fill="#354256" font-size="18">紧缩方向相反。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">货币政策</text><text x="514" y="180" fill="#354256" font-size="18">中央银行通过准备金、政策利率、公开市场操作等影</text><text x="514" y="208" fill="#354256" font-size="18">响流动性与融资条件。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">CPI与PPI</text><text x="58" y="322" fill="#354256" font-size="18">分别观察居民消费价格和工业生产者价格等，不等同</text><text x="58" y="350" fill="#354256" font-size="18">于所有资产价格。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">失业类型</text><text x="514" y="322" fill="#354256" font-size="18">摩擦性关注寻找与匹配，结构性关注岗位与技能等不</text><text x="514" y="350" fill="#354256" font-size="18">匹配，周期性联系经济波动。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">通胀与通缩</text><text x="58" y="464" fill="#354256" font-size="18">关注总体价格水平的持续变化，单一商品涨跌不足以</text><text x="58" y="492" fill="#354256" font-size="18">判断。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>