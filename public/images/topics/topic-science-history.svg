<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">科技史：人物、著作、发明与工业革命知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">科技史：人物、著作、发明与工业革命</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">数学</text><text x="58" y="180" fill="#354256" font-size="18">祖冲之与圆周率、刘徽与割圆术分别匹配，不把相关</text><text x="58" y="208" fill="#354256" font-size="18">成果都归给同一人物。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">医学</text><text x="514" y="180" fill="#354256" font-size="18">张仲景与《伤寒杂病论》、华佗与有关医学贡献、李</text><text x="514" y="208" fill="#354256" font-size="18">时珍与《本草纲目》分别核对。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">农学与工艺</text><text x="58" y="322" fill="#354256" font-size="18">王祯《农书》、宋应星《天工开物》等联系时代、内</text><text x="58" y="350" fill="#354256" font-size="18">容及生产技术。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">四大发明</text><text x="514" y="322" fill="#354256" font-size="18">造纸、印刷、指南针、火药，分别理解材料、复制、</text><text x="514" y="350" fill="#354256" font-size="18">导航、能源与军事等用途。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">三次工业革命</text><text x="58" y="464" fill="#354256" font-size="18">第一次以蒸汽机的广泛应用为重要标志；第二次联系</text><text x="58" y="492" fill="#354256" font-size="18">电力；第三次联系电子信息、原子能等技术发展。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>