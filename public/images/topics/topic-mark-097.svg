<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">资本与剩余价值 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">资本与剩余价值 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">不变资本</text><text x="58" y="180" fill="#354256" font-size="18">不变资本以生产资料形式存在，可变资本用于购买劳</text><text x="58" y="208" fill="#354256" font-size="18">动力。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">劳动力</text><text x="514" y="180" fill="#354256" font-size="18">劳动力成为商品是货币转化为资本的重要前提。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">剩余价值</text><text x="58" y="322" fill="#354256" font-size="18">剩余价值是雇佣工人在剩余劳动时间创造而被资本家</text><text x="58" y="350" fill="#354256" font-size="18">占有的价值。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">相对剩余价值</text><text x="514" y="322" fill="#354256" font-size="18">相对剩余价值生产通过缩短必要劳动时间、相应增加</text><text x="514" y="350" fill="#354256" font-size="18">剩余劳动时间实现。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>