<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">人格权、婚姻家庭与继承知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">人格权、婚姻家庭与继承</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">人格权</text><text x="58" y="180" fill="#354256" font-size="18">生命、身体、健康、姓名、肖像、名誉等权益，不能</text><text x="58" y="208" fill="#354256" font-size="18">直接视为可继承财产。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">婚姻家庭</text><text x="514" y="180" fill="#354256" font-size="18">关注身份关系与相应权利义务，生育等事项须辨认主</text><text x="514" y="208" fill="#354256" font-size="18">体与制度。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">法定继承</text><text x="58" y="322" fill="#354256" font-size="18">第一顺序包括配偶、子女、父母；第二顺序包括兄弟</text><text x="58" y="350" fill="#354256" font-size="18">姐妹、祖父母、外祖父母。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">遗嘱继承</text><text x="514" y="322" fill="#354256" font-size="18">遗嘱形式和效力应分别检查，不能只看有没有写“遗</text><text x="514" y="350" fill="#354256" font-size="18">嘱”二字。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>