<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title"><title id="title">管理职能、决策与控制知识框架</title><rect width="960" height="556" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">管理职能、决策与控制</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">决策与计划</text><text x="58" y="180" fill="#354256" font-size="18">先识别问题、评价方案和作出选择，再形成目标与行</text><text x="58" y="208" fill="#354256" font-size="18">动安排。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">组织</text><text x="514" y="180" fill="#354256" font-size="18">安排岗位、责任、权限与资源，建立协作关系。</text><rect x="36" y="258" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">领导</text><text x="58" y="322" fill="#354256" font-size="18">沟通、激励与指导，使成员共同实现目标。</text><rect x="492" y="258" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">控制</text><text x="514" y="322" fill="#354256" font-size="18">确定标准、衡量绩效、分析偏差并采取纠正措施。</text><rect x="36" y="372" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="404" fill="#24599b" font-size="20" font-weight="700">决策分类</text><text x="58" y="436" fill="#354256" font-size="18">程序化与非程序化关注是否常规；确定、风险、不确</text><text x="58" y="464" fill="#354256" font-size="18">定关注信息条件。</text><text x="36" y="534" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>