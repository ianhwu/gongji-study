<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">GDP、就业与通货膨胀 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">GDP、就业与通货膨胀 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">最终产品</text><text x="58" y="180" fill="#354256" font-size="18">GDP核算强调一定时期内最终产品和服务的价值，避</text><text x="58" y="208" fill="#354256" font-size="18">免重复计算中间投入。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">存货</text><text x="514" y="180" fill="#354256" font-size="18">当期生产但尚未售出的产品可作为存货投资纳入当期</text><text x="514" y="208" fill="#354256" font-size="18">GDP。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">名义</text><text x="58" y="322" fill="#354256" font-size="18">名义GDP通常按当期价格计算，实际GDP按不变价格</text><text x="58" y="350" fill="#354256" font-size="18">计算。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">转移支付</text><text x="514" y="322" fill="#354256" font-size="18">政府转移支付本身不属于GDP支出法中的政府购买。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>