<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title"><title id="title">长城与关隘 · 马克资料专题知识框架</title><rect width="960" height="414" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">长城与关隘 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">嘉峪关</text><text x="58" y="180" fill="#354256" font-size="18">嘉峪关位于甘肃，山海关位于河北。</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">镇北台</text><text x="514" y="180" fill="#354256" font-size="18">镇北台位于陕西榆林。</text><rect x="36" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">雁门关</text><text x="58" y="294" fill="#354256" font-size="18">雁门关位于山西，是著名关隘。</text><rect x="492" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">剑门关</text><text x="514" y="294" fill="#354256" font-size="18">李白《蜀道难》“一夫当关，万夫莫开”与剑阁险要</text><text x="514" y="322" fill="#354256" font-size="18">相关。</text><text x="36" y="392" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>