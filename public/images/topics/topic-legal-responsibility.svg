<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">法律责任、守法与法治建设知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">法律责任、守法与法治建设</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">归责</text><text x="58" y="180" fill="#354256" font-size="18">确定责任归属，需要法律依据，并遵循公正、合理等</text><text x="58" y="208" fill="#354256" font-size="18">要求。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">责任类别</text><text x="514" y="180" fill="#354256" font-size="18">刑事、民事、行政等责任依据不同；同一行为可能引</text><text x="514" y="208" fill="#354256" font-size="18">发不同责任。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">制裁</text><text x="58" y="322" fill="#354256" font-size="18">追究责任的法定措施，与法的规范作用这一分类分开</text><text x="58" y="350" fill="#354256" font-size="18">。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">法治建设</text><text x="514" y="322" fill="#354256" font-size="18">联系依法治国、公平正义、服务大局、党的领导等要</text><text x="514" y="350" fill="#354256" font-size="18">求。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>