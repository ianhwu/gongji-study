<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title"><title id="title">吉林省情知识框架知识框架</title><rect width="960" height="556" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">吉林省情知识框架</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">吉林省 / 吉林市</text><text x="58" y="180" fill="#354256" font-size="18">省级区域 / 地级市；不能因同名就把吉林市当现省</text><text x="58" y="208" fill="#354256" font-size="18">会</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">长春 / 延吉</text><text x="514" y="180" fill="#354256" font-size="18">省会 / 延边州首府；角色与行政层级分开</text><rect x="36" y="258" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">自治区 / 自治州 / 自治县</text><text x="58" y="322" fill="#354256" font-size="18">不同层级及历史语境；延边成立时名称与现称不同</text><rect x="492" y="258" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">近海 / 沿海</text><text x="514" y="322" fill="#354256" font-size="18">距离关系 / 海岸线属性；珲春近海不等于省域沿海</text><rect x="36" y="372" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="404" fill="#24599b" font-size="20" font-weight="700">统计年 / 发布年</text><text x="58" y="436" fill="#354256" font-size="18">数据所属年 / 文件公布年；2026年公布的2025年</text><text x="58" y="464" fill="#354256" font-size="18">公报仍属2025年数据</text><rect x="492" y="372" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="404" fill="#24599b" font-size="20" font-weight="700">实绩 / 目标</text><text x="514" y="436" fill="#354256" font-size="18">已经统计 / 计划预期；目标不能当全年完成值</text><text x="36" y="534" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>