<svg xmlns="http://www.w3.org/2000/svg" width="960" height="386" viewBox="0 0 960 386" role="img" aria-labelledby="title"><title id="title">重庆 · 马克资料专题知识框架</title><rect width="960" height="386" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">重庆 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">1997</text><text x="58" y="180" fill="#354256" font-size="18">重庆于1997年成为直辖市。</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">渝州</text><text x="514" y="180" fill="#354256" font-size="18">重庆的简称渝与其历史名称渝州相关。</text><rect x="36" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">大足石刻</text><text x="58" y="294" fill="#354256" font-size="18">大足石刻位于重庆。</text><rect x="492" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">瞿塘峡</text><text x="514" y="294" fill="#354256" font-size="18">长江三峡自西向东为瞿塘峡、巫峡、西陵峡。</text><text x="36" y="364" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>