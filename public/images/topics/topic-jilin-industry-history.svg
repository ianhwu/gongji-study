<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">吉林工业、科技、历史与文化知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">吉林工业、科技、历史与文化</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">汽车与装备</text><text x="58" y="180" fill="#354256" font-size="18">长春等工业基础联系一汽、轨道交通及相关装备制造</text><text x="58" y="208" fill="#354256" font-size="18">，区分企业、产品与产业门类。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">科技与教育</text><text x="514" y="180" fill="#354256" font-size="18">光学等优势领域联系科研机构、人才与产业转化。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">历史与文化</text><text x="58" y="322" fill="#354256" font-size="18">历史沿革、工业起步、电影文化等分别放回时代和地</text><text x="58" y="350" fill="#354256" font-size="18">点。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">景观识别</text><text x="514" y="322" fill="#354256" font-size="18">吉林雾凇、长白山天池、净月潭等结合位置、自然机</text><text x="514" y="350" fill="#354256" font-size="18">制与文化价值。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">年度数据</text><text x="58" y="464" fill="#354256" font-size="18">统计年份、发布年份、单位、现价或可比价等口径必</text><text x="58" y="492" fill="#354256" font-size="18">须同记。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>