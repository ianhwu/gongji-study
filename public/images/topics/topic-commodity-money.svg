<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">商品、价值规律与货币职能知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">商品、价值规律与货币职能</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">使用价值与价值</text><text x="58" y="180" fill="#354256" font-size="18">使用价值关注满足需要的属性；价值体现凝结在商品</text><text x="58" y="208" fill="#354256" font-size="18">中的无差别人类劳动。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">具体与抽象劳动</text><text x="514" y="180" fill="#354256" font-size="18">具体劳动创造使用价值；抽象劳动形成价值，两者是</text><text x="514" y="208" fill="#354256" font-size="18">同一劳动的不同方面。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">社会必要劳动时间</text><text x="58" y="322" fill="#354256" font-size="18">决定商品价值量，不能用某个生产者的个别耗时替代</text><text x="58" y="350" fill="#354256" font-size="18">。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">货币职能</text><text x="514" y="322" fill="#354256" font-size="18">价值尺度、流通手段、贮藏手段、支付手段、世界货</text><text x="514" y="350" fill="#354256" font-size="18">币，按交易过程辨析。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">价值规律</text><text x="58" y="464" fill="#354256" font-size="18">价格受供求等影响围绕价值波动，价值量与劳动生产</text><text x="58" y="492" fill="#354256" font-size="18">率关系要区分个别和社会。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>