<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title"><title id="title">光学：传播、反射、折射与透镜知识框架</title><rect width="960" height="556" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">光学：传播、反射、折射与透镜</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">直线传播</text><text x="58" y="180" fill="#354256" font-size="18">在同种均匀介质中，影子、小孔成像等可由此解释。</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">反射</text><text x="514" y="180" fill="#354256" font-size="18">镜面成像关注反射定律；平面镜像具有虚像等特征。</text><rect x="36" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">折射与色散</text><text x="58" y="294" fill="#354256" font-size="18">光进入不同介质传播方向可能改变；色散与不同颜色</text><text x="58" y="322" fill="#354256" font-size="18">光的折射差异相关。</text><rect x="492" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">凸透镜与凹透镜</text><text x="514" y="294" fill="#354256" font-size="18">分别具有会聚与发散作用，成像还需结合物距。</text><rect x="36" y="372" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="404" fill="#24599b" font-size="20" font-weight="700">视力矫正</text><text x="58" y="436" fill="#354256" font-size="18">近视通常用凹透镜矫正，远视通常用凸透镜矫正；老</text><text x="58" y="464" fill="#354256" font-size="18">视另有生理机制。</text><text x="36" y="534" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>