<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">行政主体、行政行为与社会法知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">行政主体、行政行为与社会法</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">行政机关与机构</text><text x="58" y="180" fill="#354256" font-size="18">派出机关、派出机构名称相似，是否具有独立行政主</text><text x="58" y="208" fill="#354256" font-size="18">体资格须看组织规则与授权。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">行政许可</text><text x="514" y="180" fill="#354256" font-size="18">依法准许从事特定活动；撤销、撤回、注销的原因与</text><text x="514" y="208" fill="#354256" font-size="18">效果应分别辨析。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">行政处罚</text><text x="58" y="322" fill="#354256" font-size="18">针对违反行政管理秩序的行为实施制裁，不能与刑罚</text><text x="58" y="350" fill="#354256" font-size="18">等同。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">行政征用</text><text x="514" y="322" fill="#354256" font-size="18">依法临时使用财产并涉及补偿；与改变所有权的征收</text><text x="514" y="350" fill="#354256" font-size="18">须区分。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">合法与合理</text><text x="58" y="464" fill="#354256" font-size="18">合法性关注权限、依据、程序；合理性关注比例、适</text><text x="58" y="492" fill="#354256" font-size="18">当、公正等要求。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>