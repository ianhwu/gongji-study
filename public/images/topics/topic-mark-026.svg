<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">解放战争 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">解放战争 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">大别山</text><text x="58" y="180" fill="#354256" font-size="18">1947年刘邓大军挺进大别山揭开人民解放军战略进</text><text x="58" y="208" fill="#354256" font-size="18">攻的序幕。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">辽沈</text><text x="514" y="180" fill="#354256" font-size="18">解放战争三大战役是辽沈、淮海、平津战役。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">锦州</text><text x="58" y="322" fill="#354256" font-size="18">辽沈战役中的锦州是连接东北与华北的重要战略节点</text><text x="58" y="350" fill="#354256" font-size="18">。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">南京</text><text x="514" y="322" fill="#354256" font-size="18">渡江战役期间人民解放军占领南京，结束国民党在大</text><text x="514" y="350" fill="#354256" font-size="18">陆的统治中心。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>