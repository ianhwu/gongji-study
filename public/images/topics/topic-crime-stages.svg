<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title"><title id="title">犯罪形态：预备、未遂、中止、既遂知识框架</title><rect width="960" height="414" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">犯罪形态：预备、未遂、中止、既遂</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">预备</text><text x="58" y="180" fill="#354256" font-size="18">为犯罪准备工具、制造条件，尚未着手实行。</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">未遂</text><text x="514" y="180" fill="#354256" font-size="18">已经着手，因行为人意志以外原因未得逞。</text><rect x="36" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">中止</text><text x="58" y="294" fill="#354256" font-size="18">犯罪过程中自动放弃，或自动有效防止犯罪结果发生</text><text x="58" y="322" fill="#354256" font-size="18">。</text><rect x="492" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">既遂</text><text x="514" y="294" fill="#354256" font-size="18">具备具体犯罪构成所要求的完成标准，不能统一理解</text><text x="514" y="322" fill="#354256" font-size="18">为“造成损失”。</text><text x="36" y="392" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>