<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">法人、民事权利与合同关系知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">法人、民事权利与合同关系</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">法人及公司</text><text x="58" y="180" fill="#354256" font-size="18">法人依法独立享有民事权利、承担民事义务；公司是</text><text x="58" y="208" fill="#354256" font-size="18">常见营利法人形式。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">分公司与子公司</text><text x="514" y="180" fill="#354256" font-size="18">分公司不具有法人资格；子公司通常具有独立法人资</text><text x="514" y="208" fill="#354256" font-size="18">格，不能只看名称中的“公司”。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">人身与财产权</text><text x="58" y="322" fill="#354256" font-size="18">人格权关注生命、健康、名誉等；财产权包括物权、</text><text x="58" y="350" fill="#354256" font-size="18">债权等。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">物权与债权</text><text x="514" y="322" fill="#354256" font-size="18">物权强调对特定物的直接支配；债权强调请求特定义</text><text x="514" y="350" fill="#354256" font-size="18">务人履行。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">合同与侵权</text><text x="58" y="464" fill="#354256" font-size="18">合同围绕约定与履行；侵权围绕侵害权益及相应责任</text><text x="58" y="492" fill="#354256" font-size="18">，具体案件还需看责任竞合规则。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>