<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">知识产权：著作权、专利与商标知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">知识产权：著作权、专利与商标</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">著作权</text><text x="58" y="180" fill="#354256" font-size="18">联系文学、艺术、科学作品的创作与表达，不保护抽</text><text x="58" y="208" fill="#354256" font-size="18">象思想本身。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">专利权</text><text x="514" y="180" fill="#354256" font-size="18">发明、实用新型、外观设计的制度对象和条件不同。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">商标权</text><text x="58" y="322" fill="#354256" font-size="18">关注区分商品或服务来源的标识，不能与作品作者署</text><text x="58" y="350" fill="#354256" font-size="18">名混同。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">权利边界</text><text x="514" y="322" fill="#354256" font-size="18">保护对象、取得条件、期限和侵权行为分别核查，不</text><text x="514" y="350" fill="#354256" font-size="18">能一概套用。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>