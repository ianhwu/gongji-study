<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title"><title id="title">法律关系与法律事实知识框架</title><rect width="960" height="556" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">法律关系与法律事实</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">主体</text><text x="58" y="180" fill="#354256" font-size="18">参与法律关系的人或组织，注意具体关系要求的主体</text><text x="58" y="208" fill="#354256" font-size="18">资格。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">内容</text><text x="514" y="180" fill="#354256" font-size="18">法律权利与法律义务，二者具有对应关系。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">客体</text><text x="58" y="322" fill="#354256" font-size="18">权利义务共同指向的对象，不能与参与关系的主体混</text><text x="58" y="350" fill="#354256" font-size="18">淆。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">行为</text><text x="514" y="322" fill="#354256" font-size="18">与人的意志有关的法律事实，如订立合同。</text><rect x="36" y="400" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">事件</text><text x="58" y="464" fill="#354256" font-size="18">不以人的意志为转移的法律事实，如自然灾害。</text><text x="36" y="534" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>