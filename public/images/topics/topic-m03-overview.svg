<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title"><title id="title">刑法、行政法与社会法知识框架知识框架</title><rect width="960" height="500" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">刑法、行政法与社会法知识框架</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">犯罪预备</text><text x="58" y="180" fill="#354256" font-size="18">尚未着手；准备工具、制造条件并因外因未能着手</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">犯罪未遂</text><text x="514" y="180" fill="#354256" font-size="18">已着手、外因未得逞；抓“想继续但被阻止”</text><rect x="36" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">犯罪中止</text><text x="58" y="294" fill="#354256" font-size="18">自动放弃或自动有效防止结果；抓自动性与有效性</text><rect x="492" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">行政复议</text><text x="514" y="294" fill="#354256" font-size="18">依法向复议机关申请；与诉讼的法院路径区分</text><rect x="36" y="344" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="376" fill="#24599b" font-size="20" font-weight="700">行政诉讼</text><text x="58" y="408" fill="#354256" font-size="18">依法向人民法院起诉；受案、管辖、程序分别判断</text><text x="36" y="478" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>