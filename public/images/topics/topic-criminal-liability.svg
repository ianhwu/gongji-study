<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">刑事责任、防卫与刑罚知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">刑事责任、防卫与刑罚</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">罪刑法定</text><text x="58" y="180" fill="#354256" font-size="18">犯罪与刑罚须有法律依据，不能凭道德厌恶类推入罪</text><text x="58" y="208" fill="#354256" font-size="18">。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">正当防卫</text><text x="514" y="180" fill="#354256" font-size="18">围绕正在进行的不法侵害，向不法侵害人采取制止行</text><text x="514" y="208" fill="#354256" font-size="18">为，并检查法定限度等条件。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">自首</text><text x="58" y="322" fill="#354256" font-size="18">关注自动投案、如实供述等法定要求；犯罪后表现与</text><text x="58" y="350" fill="#354256" font-size="18">犯罪形态分开。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">主刑与附加刑</text><text x="514" y="322" fill="#354256" font-size="18">主刑包括管制、拘役、有期徒刑、无期徒刑、死刑；</text><text x="514" y="350" fill="#354256" font-size="18">附加刑另作分类。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">裁判权限</text><text x="58" y="464" fill="#354256" font-size="18">依法定程序由人民法院作出刑事裁判，刑罚与行政处</text><text x="58" y="492" fill="#354256" font-size="18">罚不能混用。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>