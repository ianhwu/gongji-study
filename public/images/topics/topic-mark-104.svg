<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">法的概念与法律关系 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">法的概念与法律关系 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">国家意志</text><text x="58" y="180" fill="#354256" font-size="18">法体现国家意志，通过法定程序制定或者认可。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">权利和义务</text><text x="514" y="180" fill="#354256" font-size="18">法律关系以法律规范为依据，其内容包括法律上的权</text><text x="514" y="208" fill="#354256" font-size="18">利和义务。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">法律事实</text><text x="58" y="322" fill="#354256" font-size="18">能够引起法律关系产生、变更、消灭的事实称为法律</text><text x="58" y="350" fill="#354256" font-size="18">事实。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">规范作用</text><text x="514" y="322" fill="#354256" font-size="18">法的指引作用主要表现为对本人行为提供行为模式。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>