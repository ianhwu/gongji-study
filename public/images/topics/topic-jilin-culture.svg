<svg xmlns="http://www.w3.org/2000/svg" width="960" height="614" viewBox="0 0 960 614" role="img" aria-labelledby="title"><title id="title">吉林历史、文化遗产与城市发展知识框架</title><rect width="960" height="614" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">吉林历史、文化遗产与城市发展</text><text x="36" y="86" fill="#576579" font-size="17">按时间排列；各节点的背景与影响需分别理解。</text><rect x="36" y="116" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">城市与区划</text><text x="58" y="180" fill="#354256" font-size="18">吉林市、长春、延边的历史节点与现行区划分开。</text><rect x="36" y="230" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">工业起步</text><text x="58" y="294" fill="#354256" font-size="18">一汽、长影等按奠基、建成、投产、改称分别记节点。</text><rect x="36" y="344" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="376" fill="#24599b" font-size="20" font-weight="700">遗产与非遗</text><text x="58" y="408" fill="#354256" font-size="18">集安高句丽遗址是文化遗产；查干湖冬捕联系非物质文化遗产。</text><rect x="36" y="458" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="490" fill="#24599b" font-size="20" font-weight="700">地域文化</text><text x="58" y="522" fill="#354256" font-size="18">雾凇、冬捕等联系当地自然条件与文化实践。</text><text x="36" y="592" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>