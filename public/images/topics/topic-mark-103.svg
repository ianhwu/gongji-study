<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">公文办理 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">公文办理 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">收文办理</text><text x="58" y="180" fill="#354256" font-size="18">收文办理包括签收、登记、初审、承办、传阅、催办</text><text x="58" y="208" fill="#354256" font-size="18">、答复等程序。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">发文办理</text><text x="514" y="180" fill="#354256" font-size="18">发文办理主要包括复核、登记、印制、核发等程序。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">清退</text><text x="58" y="322" fill="#354256" font-size="18">公文整理归档需依有关档案规定办理，不应由个人随</text><text x="58" y="350" fill="#354256" font-size="18">意销毁正式文件。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">保密</text><text x="514" y="322" fill="#354256" font-size="18">公文管理应依据密级等要求做好保密和安全管理。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>