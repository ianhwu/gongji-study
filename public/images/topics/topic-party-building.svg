<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title"><title id="title">党的领导与全面从严治党知识框架</title><rect width="960" height="556" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">党的领导与全面从严治党</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">政治建设</text><text x="58" y="180" fill="#354256" font-size="18">关注政治方向、政治立场、政治能力等根本性问题。</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">思想建设</text><text x="514" y="180" fill="#354256" font-size="18">关注理论武装、理想信念与思想认识。</text><rect x="36" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">组织建设</text><text x="58" y="294" fill="#354256" font-size="18">关注组织体系、干部与党员队伍等。</text><rect x="492" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">作风与纪律</text><text x="514" y="294" fill="#354256" font-size="18">前者聚焦工作作风和群众关系等；后者聚焦纪律规范</text><text x="514" y="322" fill="#354256" font-size="18">及其执行。</text><rect x="36" y="372" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="404" fill="#24599b" font-size="20" font-weight="700">监督与制度</text><text x="58" y="436" fill="#354256" font-size="18">约束权力运行，完善机制，将要求落实到具体程序和</text><text x="58" y="464" fill="#354256" font-size="18">责任。</text><text x="36" y="534" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>