<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">磁场与电磁波 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">磁场与电磁波 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">电磁波</text><text x="58" y="180" fill="#354256" font-size="18">电磁波能够在真空中传播，声波不能在真空中传播</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">指南针</text><text x="514" y="180" fill="#354256" font-size="18">指南针北极通常指向地理北极附近，那里接近地磁南</text><text x="514" y="208" fill="#354256" font-size="18">极。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">紫外</text><text x="58" y="322" fill="#354256" font-size="18">紫外线的频率高于可见光，红外线的频率低于可见光</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">赫兹</text><text x="514" y="322" fill="#354256" font-size="18">麦克斯韦预言电磁波，赫兹通过实验验证电磁波存在</text><text x="514" y="350" fill="#354256" font-size="18">。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>