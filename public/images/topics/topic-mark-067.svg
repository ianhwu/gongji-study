<svg xmlns="http://www.w3.org/2000/svg" width="960" height="386" viewBox="0 0 960 386" role="img" aria-labelledby="title"><title id="title">中医中药 · 马克资料专题知识框架</title><rect width="960" height="386" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">中医中药 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">黄帝内经</text><text x="58" y="180" fill="#354256" font-size="18">《黄帝内经》主要分为《素问》和《灵枢》两部分。</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">四诊</text><text x="514" y="180" fill="#354256" font-size="18">传统中医四诊指望、闻、问、切。</text><rect x="36" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">五脏</text><text x="58" y="294" fill="#354256" font-size="18">传统中医理论中的五脏指心、肝、脾、肺、肾。</text><rect x="492" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">四气</text><text x="514" y="294" fill="#354256" font-size="18">传统中药理论中的四气指寒、热、温、凉。</text><text x="36" y="364" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>