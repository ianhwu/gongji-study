<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title"><title id="title">失业 · 马克资料专题知识框架</title><rect width="960" height="414" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">失业 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">摩擦性</text><text x="58" y="180" fill="#354256" font-size="18">劳动者更换工作时因寻找岗位需要时间而暂时失业，</text><text x="58" y="208" fill="#354256" font-size="18">属于摩擦性失业。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">结构性</text><text x="514" y="180" fill="#354256" font-size="18">劳动者技能与产业转型后的岗位要求不匹配，属于结</text><text x="514" y="208" fill="#354256" font-size="18">构性失业。</text><rect x="36" y="258" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">充分就业</text><text x="58" y="322" fill="#354256" font-size="18">充分就业仍可存在摩擦性和结构性失业。</text><rect x="492" y="258" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">失业率</text><text x="514" y="322" fill="#354256" font-size="18">失业率的分母通常为劳动力人口，而非全部人口。</text><text x="36" y="392" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>