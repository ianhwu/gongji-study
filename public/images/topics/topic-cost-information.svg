<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">成本决策、信息不对称与企业知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">成本决策、信息不对称与企业</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">机会成本</text><text x="58" y="180" fill="#354256" font-size="18">选择某方案而放弃的最佳替代方案的收益。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">沉没成本</text><text x="514" y="180" fill="#354256" font-size="18">已经发生且不可收回的成本，不应因已投入就盲目继</text><text x="514" y="208" fill="#354256" font-size="18">续。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">边际与固定成本</text><text x="58" y="322" fill="#354256" font-size="18">边际成本关注多增加一单位；固定成本在一定范围内</text><text x="58" y="350" fill="#354256" font-size="18">不随产量变化。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">逆向选择</text><text x="514" y="322" fill="#354256" font-size="18">交易前信息不对称，使较差类型更容易进入交易。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">道德风险</text><text x="58" y="464" fill="#354256" font-size="18">交易后因行为难以监督，出现激励扭曲；不必以道德</text><text x="58" y="492" fill="#354256" font-size="18">恶劣作为定义。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>