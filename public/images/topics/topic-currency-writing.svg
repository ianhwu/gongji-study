<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">人民币票面文字与民族文化知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">人民币票面文字与民族文化</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">五种文字</text><text x="58" y="180" fill="#354256" font-size="18">汉文、蒙古文、藏文、维吾尔文、壮文；注意文字名</text><text x="58" y="208" fill="#354256" font-size="18">称与民族名称的表述。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">观察位置</text><text x="514" y="180" fill="#354256" font-size="18">核对票面中国人民银行等名称的多文字标注，完整票</text><text x="514" y="208" fill="#354256" font-size="18">面与局部图所含信息不同。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">版别与面额</text><text x="58" y="322" fill="#354256" font-size="18">具体图案、防伪技术等随版别和面额变化，不从局部</text><text x="58" y="350" fill="#354256" font-size="18">照片推广到所有人民币。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>