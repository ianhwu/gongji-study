<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">地球运动、岩石与地貌知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">地球运动、岩石与地貌</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">自转与公转</text><text x="58" y="180" fill="#354256" font-size="18">昼夜交替等联系自转；季节变化结合公转与地轴倾斜</text><text x="58" y="208" fill="#354256" font-size="18">理解。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">二分二至</text><text x="514" y="180" fill="#354256" font-size="18">春分、秋分、夏至、冬至联系太阳直射点位置变化，</text><text x="514" y="208" fill="#354256" font-size="18">半球差异要说明。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">三类岩石</text><text x="58" y="322" fill="#354256" font-size="18">岩浆岩、沉积岩、变质岩按形成过程分类，颜色并非</text><text x="58" y="350" fill="#354256" font-size="18">唯一识别标准。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">化石与年代</text><text x="514" y="322" fill="#354256" font-size="18">化石多见于沉积岩，年代判断还需结合地层和古生物</text><text x="514" y="350" fill="#354256" font-size="18">等证据。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">地貌</text><text x="58" y="464" fill="#354256" font-size="18">喀斯特联系可溶岩石与水作用；花岗岩地貌等结合岩</text><text x="58" y="492" fill="#354256" font-size="18">性与构造、风化侵蚀。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>