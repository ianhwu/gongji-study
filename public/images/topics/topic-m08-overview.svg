<svg xmlns="http://www.w3.org/2000/svg" width="960" height="528" viewBox="0 0 960 528" role="img" aria-labelledby="title"><title id="title">公文知识框架知识框架</title><rect width="960" height="528" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">公文知识框架</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">请示</text><text x="58" y="180" fill="#354256" font-size="18">请求指示、批准；通常一文一事，不夹带在报告中</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">报告</text><text x="514" y="180" fill="#354256" font-size="18">汇报、反映、答复询问；不以请求批准为主要目的</text><rect x="36" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">批复</text><text x="58" y="294" fill="#354256" font-size="18">答复下级请示；行文目的明确</text><rect x="492" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">函</text><text x="514" y="294" fill="#354256" font-size="18">不相隶属机关商洽等；不能把不相隶属理解成只能同</text><text x="514" y="322" fill="#354256" font-size="18">级</text><rect x="36" y="372" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="404" fill="#24599b" font-size="20" font-weight="700">纪要</text><text x="58" y="436" fill="#354256" font-size="18">主要会议情况和议定事项；不是逐字会议记录</text><text x="36" y="506" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>