<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">十五种公文：文种与行文方向知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">十五种公文：文种与行文方向</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">请求与答复</text><text x="58" y="180" fill="#354256" font-size="18">请示请求上级指示、批准；批复答复下级请示；报告</text><text x="58" y="208" fill="#354256" font-size="18">汇报情况、回复询问。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">商洽与审批</text><text x="514" y="180" fill="#354256" font-size="18">函用于不相隶属机关之间有关公务联系，包括依法请</text><text x="514" y="208" fill="#354256" font-size="18">求批准和答复审批事项。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">公布与告知</text><text x="58" y="322" fill="#354256" font-size="18">公告、通告、公报、通知、通报分别有不同范围、事</text><text x="58" y="350" fill="#354256" font-size="18">项与用途。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">决策与会议</text><text x="514" y="322" fill="#354256" font-size="18">决议、决定、命令、纪要，按形成方式和效力用途辨</text><text x="514" y="350" fill="#354256" font-size="18">析。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">意见与议案</text><text x="58" y="464" fill="#354256" font-size="18">意见提出见解和处理办法；议案用于政府向同级人大</text><text x="58" y="492" fill="#354256" font-size="18">或其常委会依法提请审议。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>