<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">自然人民事能力与监护知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">自然人民事能力与监护</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">民事权利能力</text><text x="58" y="180" fill="#354256" font-size="18">自然人从出生时起到死亡时止享有，不随年龄大小区</text><text x="58" y="208" fill="#354256" font-size="18">别对待。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">完全民事行为能力</text><text x="514" y="180" fill="#354256" font-size="18">成年人一般属于此类；十六周岁以上、以劳动收入为</text><text x="514" y="208" fill="#354256" font-size="18">主要生活来源的未成年人依法视为完全行为能力人。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">限制行为能力</text><text x="58" y="322" fill="#354256" font-size="18">八周岁以上未成年人通常属于此类；纯获利益或与其</text><text x="58" y="350" fill="#354256" font-size="18">年龄、智力相适应的行为可独立实施。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">无民事行为能力</text><text x="514" y="322" fill="#354256" font-size="18">不满八周岁未成年人，及不能辨认自己行为的成年人</text><text x="514" y="350" fill="#354256" font-size="18">，由法定代理人代理实施民事法律行为。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">监护</text><text x="58" y="464" fill="#354256" font-size="18">保护被监护人的人身、财产等合法权益，履职应遵循</text><text x="58" y="492" fill="#354256" font-size="18">最有利于被监护人的原则。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>