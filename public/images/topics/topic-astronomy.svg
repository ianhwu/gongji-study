<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">天文：太阳系、月球与观测现象知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">天文：太阳系、月球与观测现象</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">太阳系层级</text><text x="58" y="180" fill="#354256" font-size="18">太阳是恒星，行星围绕太阳运行，卫星围绕行星等天</text><text x="58" y="208" fill="#354256" font-size="18">体运行。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">行星分类</text><text x="514" y="180" fill="#354256" font-size="18">类地行星与巨行星的体积、组成等存在差异，顺序与</text><text x="514" y="208" fill="#354256" font-size="18">类别分别记忆。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">月球</text><text x="58" y="322" fill="#354256" font-size="18">是地球天然卫星；月相变化与日地月位置和观察角度</text><text x="58" y="350" fill="#354256" font-size="18">相关。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">彗星与太阳黑子</text><text x="514" y="322" fill="#354256" font-size="18">分别关注小天体和太阳活动现象，不能因名称相近而</text><text x="514" y="350" fill="#354256" font-size="18">混为一类。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">技术时间线</text><text x="58" y="464" fill="#354256" font-size="18">三次工业革命、重要科学与航天成果，按时间、技术</text><text x="58" y="492" fill="#354256" font-size="18">突破、影响三栏整理。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>