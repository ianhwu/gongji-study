<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title"><title id="title">管理与事业单位知识框架知识框架</title><rect width="960" height="500" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">管理与事业单位知识框架</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">首因效应</text><text x="58" y="180" fill="#354256" font-size="18">最初印象；不是最近信息</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">近因效应</text><text x="514" y="180" fill="#354256" font-size="18">近期信息；不是一个优点推断整体</text><rect x="36" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">晕轮效应</text><text x="58" y="294" fill="#354256" font-size="18">以点代面；可能正面，也可能负面</text><rect x="492" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">技术技能</text><text x="514" y="294" fill="#354256" font-size="18">专业操作；基层相对更直接需要</text><rect x="36" y="344" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="376" fill="#24599b" font-size="20" font-weight="700">概念技能</text><text x="58" y="408" fill="#354256" font-size="18">整体分析决断；高层相对更需要</text><text x="36" y="478" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>