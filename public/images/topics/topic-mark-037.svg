<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">陆游 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">陆游 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">放翁</text><text x="58" y="180" fill="#354256" font-size="18">陆游字务观，号放翁，是南宋诗人。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">游山西村</text><text x="514" y="180" fill="#354256" font-size="18">“山重水复疑无路，柳暗花明又一村”出自陆游《游</text><text x="514" y="208" fill="#354256" font-size="18">山西村》。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">冬夜读书</text><text x="58" y="322" fill="#354256" font-size="18">“纸上得来终觉浅，绝知此事要躬行”强调亲身实践</text><text x="58" y="350" fill="#354256" font-size="18">的重要性。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">示儿</text><text x="514" y="322" fill="#354256" font-size="18">陆游《示儿》中的“王师北定中原日”体现收复失地</text><text x="514" y="350" fill="#354256" font-size="18">的愿望。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>