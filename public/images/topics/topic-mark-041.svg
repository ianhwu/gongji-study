<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">麒麟补子 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">麒麟补子 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">文官</text><text x="58" y="180" fill="#354256" font-size="18">明清官服补子常以飞禽区分文官品级，以走兽区分武</text><text x="58" y="208" fill="#354256" font-size="18">官品级。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">仙鹤</text><text x="514" y="180" fill="#354256" font-size="18">明清文官一品补子的图案为仙鹤。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">清代</text><text x="58" y="322" fill="#354256" font-size="18">清代武官一品补子的图案为麒麟。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">獬豸</text><text x="514" y="322" fill="#354256" font-size="18">獬豸图案常与明代风宪官、清代御史等监察官服饰相</text><text x="514" y="350" fill="#354256" font-size="18">关。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>