<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title"><title id="title">物态变化、声音与电磁波知识框架</title><rect width="960" height="556" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">物态变化、声音与电磁波</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">固→液→气</text><text x="58" y="180" fill="#354256" font-size="18">熔化与汽化吸热；固体直接变气体是升华，也吸热。</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">气→液→固</text><text x="514" y="180" fill="#354256" font-size="18">液化与凝固放热；气体直接变固体是凝华，也放热。</text><rect x="36" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">声音</text><text x="58" y="294" fill="#354256" font-size="18">由振动产生，传播需要介质；音调、响度、音色分别</text><text x="58" y="322" fill="#354256" font-size="18">反映不同特征。</text><rect x="492" y="230" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">电磁波</text><text x="514" y="294" fill="#354256" font-size="18">可在真空传播；与声波的传播条件不同。</text><rect x="36" y="372" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="404" fill="#24599b" font-size="20" font-weight="700">观察辨析</text><text x="58" y="436" fill="#354256" font-size="18">白气是细小液滴等形成的可见现象，水蒸气本身通常</text><text x="58" y="464" fill="#354256" font-size="18">不可见。</text><text x="36" y="534" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>