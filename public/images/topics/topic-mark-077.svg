<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">立法法修改 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">立法法修改 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">国家立法权</text><text x="58" y="180" fill="#354256" font-size="18">全国人民代表大会及其常务委员会行使国家立法权。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">犯罪和刑罚</text><text x="514" y="180" fill="#354256" font-size="18">犯罪和刑罚属于必须制定法律、不得授权国务院先行</text><text x="514" y="208" fill="#354256" font-size="18">制定行政法规的事项。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">三十名</text><text x="58" y="322" fill="#354256" font-size="18">一个代表团或者三十名以上全国人大代表联名，可依</text><text x="58" y="350" fill="#354256" font-size="18">法提出法律案。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">基本法律</text><text x="514" y="322" fill="#354256" font-size="18">全国人大制定和修改刑事、民事、国家机构等基本法</text><text x="514" y="350" fill="#354256" font-size="18">律。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>