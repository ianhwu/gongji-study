<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">传统纪年、时辰、称谓与科举知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">传统纪年、时辰、称谓与科举</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">干支纪年</text><text x="58" y="180" fill="#354256" font-size="18">十天干与十二地支按固定次序配合，六十组合形成一</text><text x="58" y="208" fill="#354256" font-size="18">个循环。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">十二时辰</text><text x="514" y="180" fill="#354256" font-size="18">子丑寅卯辰巳午未申酉戌亥；一个时辰约合两小时。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">年龄称谓</text><text x="58" y="322" fill="#354256" font-size="18">及笄、弱冠、而立、不惑、知天命、耳顺、古稀等分</text><text x="58" y="350" fill="#354256" font-size="18">别核对年龄与传统语境。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">孟仲季</text><text x="514" y="322" fill="#354256" font-size="18">通常指一个季节的第一、第二、第三月，不对应固定</text><text x="514" y="350" fill="#354256" font-size="18">公历月份。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">科举层级</text><text x="58" y="464" fill="#354256" font-size="18">乡试、会试、殿试联系举人、贡士、进士等；具体称</text><text x="58" y="492" fill="#354256" font-size="18">谓与考试阶段对应。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>