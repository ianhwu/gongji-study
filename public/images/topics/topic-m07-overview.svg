<svg xmlns="http://www.w3.org/2000/svg" width="960" height="528" viewBox="0 0 960 528" role="img" aria-labelledby="title"><title id="title">经济学知识框架知识框架</title><rect width="960" height="528" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">经济学知识框架</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">价值尺度</text><text x="58" y="180" fill="#354256" font-size="18">标价；可以是观念上的货币</text><rect x="492" y="116" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">流通手段</text><text x="514" y="180" fill="#354256" font-size="18">即时钱货交换；不是所有转账都必然属于同一职能</text><rect x="36" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">支付手段</text><text x="58" y="294" fill="#354256" font-size="18">偿债、工资等；关注钱货是否同步</text><rect x="492" y="230" width="432" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="262" fill="#24599b" font-size="20" font-weight="700">财政政策</text><text x="514" y="294" fill="#354256" font-size="18">税收、支出等；主体、工具与方向分别辨析</text><rect x="36" y="344" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="376" fill="#24599b" font-size="20" font-weight="700">货币政策</text><text x="58" y="408" fill="#354256" font-size="18">准备金、利率、公开市场操作等；不能把税率当货币</text><text x="58" y="436" fill="#354256" font-size="18">工具</text><text x="36" y="506" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>