<svg xmlns="http://www.w3.org/2000/svg" width="960" height="728" viewBox="0 0 960 728" role="img" aria-labelledby="title"><title id="title">中国近现代史：阶段、事件与影响知识框架</title><rect width="960" height="728" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">中国近现代史：阶段、事件与影响</text><text x="36" y="86" fill="#576579" font-size="17">按时间排列；各节点的背景与影响需分别理解。</text><rect x="36" y="116" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">1840年前后</text><text x="58" y="180" fill="#354256" font-size="18">鸦片战争联系近代中国社会变化与外部冲击。</text><rect x="36" y="230" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="262" fill="#24599b" font-size="20" font-weight="700">1911—1912</text><text x="58" y="294" fill="#354256" font-size="18">辛亥革命及中华民国建立，辨认推翻帝制与实现全部革命任务的差别。</text><rect x="36" y="344" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="376" fill="#24599b" font-size="20" font-weight="700">1919</text><text x="58" y="408" fill="#354256" font-size="18">五四运动联系新民主主义革命的历史起点与社会力量变化。</text><rect x="36" y="458" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="490" fill="#24599b" font-size="20" font-weight="700">1921以后</text><text x="58" y="522" fill="#354256" font-size="18">中国共产党成立，联系新的领导力量与革命道路探索。</text><rect x="36" y="572" width="888" height="92" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="604" fill="#24599b" font-size="20" font-weight="700">1949</text><text x="58" y="636" fill="#354256" font-size="18">中华人民共和国成立，联系国家与社会发展的历史转折。</text><text x="36" y="706" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>