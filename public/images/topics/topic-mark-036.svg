<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">垄断与价格歧视 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">垄断与价格歧视 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">一级</text><text x="58" y="180" fill="#354256" font-size="18">一级价格歧视按每位消费者对每单位商品的最高支付</text><text x="58" y="208" fill="#354256" font-size="18">意愿定价。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">二级</text><text x="514" y="180" fill="#354256" font-size="18">依据购买数量设置不同价格菜单，是二级价格歧视的</text><text x="514" y="208" fill="#354256" font-size="18">常见形式。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">三级</text><text x="58" y="322" fill="#354256" font-size="18">对学生与其他乘客设置不同票价，可作为三级价格歧</text><text x="58" y="350" fill="#354256" font-size="18">视的例子。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">横向</text><text x="514" y="322" fill="#354256" font-size="18">竞争关系经营者之间的垄断协议属于横向垄断协议。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>