<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">力学、机械与能量转换知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">力学、机械与能量转换</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">惯性与力</text><text x="58" y="180" fill="#354256" font-size="18">惯性是物体保持原有运动状态的性质；不能把它说成</text><text x="58" y="208" fill="#354256" font-size="18">额外一种力。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">杠杆</text><text x="514" y="180" fill="#354256" font-size="18">按支点、动力臂、阻力臂分析平衡；省力与距离变化</text><text x="514" y="208" fill="#354256" font-size="18">相联系。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">滑轮</text><text x="58" y="322" fill="#354256" font-size="18">定滑轮主要改变力方向；动滑轮省力条件及滑轮组受</text><text x="58" y="350" fill="#354256" font-size="18">力需结合结构。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">压强与浮力</text><text x="514" y="322" fill="#354256" font-size="18">压强联系压力和受力面积；浮力联系排开流体的情况</text><text x="514" y="350" fill="#354256" font-size="18">。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">能量转换</text><text x="58" y="464" fill="#354256" font-size="18">风机、发电设备等连接机械能与电能，实际过程还存</text><text x="58" y="492" fill="#354256" font-size="18">在损耗。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>