<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">联系、发展与矛盾分析知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">联系、发展与矛盾分析</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">联系与发展</text><text x="58" y="180" fill="#354256" font-size="18">联系要有客观依据；发展关注前进上升和新事物产生</text><text x="58" y="208" fill="#354256" font-size="18">，变化不必然等于发展。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">量变与质变</text><text x="514" y="180" fill="#354256" font-size="18">量变是质变的必要准备，质变是量变的必然结果；要</text><text x="514" y="208" fill="#354256" font-size="18">结合范围和条件判断。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">内因与外因</text><text x="58" y="322" fill="#354256" font-size="18">内因是变化根据，外因是变化条件，外因通过内因起</text><text x="58" y="350" fill="#354256" font-size="18">作用。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">普遍与特殊</text><text x="514" y="322" fill="#354256" font-size="18">矛盾普遍存在，同时各有特点；要求具体问题具体分</text><text x="514" y="350" fill="#354256" font-size="18">析。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">主要矛盾与主要方面</text><text x="58" y="464" fill="#354256" font-size="18">前者在多个矛盾中确定重点，后者在一个矛盾内部判</text><text x="58" y="492" fill="#354256" font-size="18">断主导方面。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>