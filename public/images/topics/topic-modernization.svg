<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title"><title id="title">中国式现代化、发展理念与共同富裕知识框架</title><rect width="960" height="584" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">中国式现代化、发展理念与共同富裕</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">中国特色</text><text x="58" y="180" fill="#354256" font-size="18">人口规模巨大、全体人民共同富裕、物质文明和精神</text><text x="58" y="208" fill="#354256" font-size="18">文明相协调、人与自然和谐共生、走和平发展道路。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">创新与协调</text><text x="514" y="180" fill="#354256" font-size="18">创新重在发展动力；协调重在发展不平衡问题。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">绿色与开放</text><text x="58" y="322" fill="#354256" font-size="18">绿色关注人与自然关系；开放关注内外联动与合作。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">共享</text><text x="514" y="322" fill="#354256" font-size="18">关注社会公平正义，使发展成果更多更公平惠及全体</text><text x="514" y="350" fill="#354256" font-size="18">人民。</text><rect x="36" y="400" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="432" fill="#24599b" font-size="20" font-weight="700">共同富裕</text><text x="58" y="464" fill="#354256" font-size="18">全体人民共同富裕，既重视物质生活，也重视精神生</text><text x="58" y="492" fill="#354256" font-size="18">活。</text><text x="36" y="562" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>