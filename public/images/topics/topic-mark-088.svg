<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title"><title id="title">唯物论：物质、意识与规律 · 马克资料专题知识框架</title><rect width="960" height="442" fill="#f5f8fc"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="36" y="50" fill="#183254" font-size="26" font-weight="700">唯物论：物质、意识与规律 · 马克资料专题</text><text x="36" y="86" fill="#576579" font-size="17">分类对照；各组概念的条件与适用范围需分别辨析。</text><rect x="36" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="148" fill="#24599b" font-size="20" font-weight="700">客观实在性</text><text x="58" y="180" fill="#354256" font-size="18">客观实在性是物质的唯一特性，运动是物质的根本属</text><text x="58" y="208" fill="#354256" font-size="18">性和存在方式。</text><rect x="492" y="116" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="148" fill="#24599b" font-size="20" font-weight="700">相对静止</text><text x="514" y="180" fill="#354256" font-size="18">运动是绝对的，静止是相对的、有条件的。</text><rect x="36" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="58" y="290" fill="#24599b" font-size="20" font-weight="700">主观映象</text><text x="58" y="322" fill="#354256" font-size="18">意识是人脑对客观存在的主观映象。</text><rect x="492" y="258" width="432" height="120" rx="14" fill="#ffffff" stroke="#c7d7e9"/><text x="514" y="290" fill="#24599b" font-size="20" font-weight="700">物质决定意识</text><text x="514" y="322" fill="#354256" font-size="18">物质决定意识，意识能通过实践对物质产生能动反作</text><text x="514" y="350" fill="#354256" font-size="18">用。</text><text x="36" y="420" fill="#576579" font-size="15">公基学习台 · 依据提供资料整理，完整讲解与出处见专题页</text></g></svg>